<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SokkerPRO Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e6eb;
      min-height: 100vh;
    }

    .header {
      background: #1a1d24;
      border-bottom: 1px solid #2d3139;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffd21e;
    }

    .header .subtitle {
      font-size: 13px;
      color: #8b8f98;
    }


    select, input {
      background: #252830;
      border: 1px solid #3a3d45;
      color: #e4e6eb;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #ffd21e;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      background: #15171c;
      border-bottom: 1px solid #2d3139;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffd21e;
    }

    .stat-label {
      font-size: 11px;
      color: #8b8f98;
      text-transform: uppercase;
    }

    .container {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .match-grid {
      display: grid;
      gap: 12px;
    }

    .match-card {
      background: #1a1d24;
      border: 1px solid #2d3139;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .match-card:hover {
      border-color: #ffd21e;
      transform: translateY(-1px);
    }

    .match-card.has-goals {
      border-left: 3px solid #22c55e;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .competition {
      font-size: 12px;
      color: #8b8f98;
    }

    .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-live { background: #dc2626; color: white; }
    .status-finished { background: #22c55e; color: white; }
    .status-not_started { background: #3a3d45; color: #8b8f98; }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .team {
      flex: 1;
      text-align: center;
    }

    .team-name {
      font-size: 14px;
      font-weight: 600;
    }

    .score {
      font-size: 28px;
      font-weight: 700;
      color: #ffd21e;
      min-width: 80px;
      text-align: center;
    }

    .score .separator {
      color: #8b8f98;
      margin: 0 4px;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      color: #8b8f98;
    }

    .goals-list {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2d3139;
    }

    .goal {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
    }

    .goal-minute {
      color: #ffd21e;
      font-weight: 600;
      min-width: 40px;
    }

    .goal-player {
      color: #e4e6eb;
    }

    .goal-team {
      color: #8b8f98;
      font-size: 11px;
    }

    /* Detail Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1d24;
      border: 1px solid #2d3139;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #8b8f98;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #e4e6eb;
    }

    .timeline {
      margin-top: 20px;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #2d3139;
    }

    .timeline-icon {
      font-size: 16px;
      width: 24px;
      text-align: center;
    }

    .timeline-minute {
      color: #ffd21e;
      font-weight: 600;
      min-width: 40px;
    }

    .timeline-content {
      flex: 1;
    }

    .timeline-player {
      font-weight: 600;
    }

    .timeline-desc {
      color: #8b8f98;
      font-size: 12px;
    }

    .odds-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding: 12px;
      background: #252830;
      border-radius: 8px;
    }

    .odd-item {
      text-align: center;
      flex: 1;
    }

    .odd-label {
      font-size: 11px;
      color: #8b8f98;
      margin-bottom: 4px;
    }

    .odd-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd21e;
    }

    .loading {
      text-align: center;
      padding: 48px;
      color: #8b8f98;
    }

    .empty {
      text-align: center;
      padding: 48px;
      color: #8b8f98;
    }

    :root {
      --pitch: #10251d;
      --canvas: #111714;
      --surface: #18201c;
      --surface-raised: #202a24;
      --line: rgba(214, 230, 215, 0.12);
      --ink: #edf4ed;
      --muted: #91a096;
      --signal: #f5c542;
      --signal-wash: rgba(245, 197, 66, 0.14);
      --win: #5fd28b;
      --loss: #ea6e6e;
    }

    .view-tabs { display: flex; gap: 4px; margin-left: 24px; }
    .view-tab {
      background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 8px 10px;
      text-transform: uppercase;
    }
    .view-tab:hover, .view-tab:focus-visible { color: var(--ink); outline: none; }
    .view-tab.active { border-bottom-color: var(--signal); color: var(--signal); }
    .app-view { display: none; }
    .app-view.active { display: block; }
    .goals-lab { background: var(--canvas); color: var(--ink); min-height: calc(100vh - 75px); }
    .lab-shell { max-width: 1240px; margin: 0 auto; padding: 44px 24px 72px; }
    .lab-eyebrow { color: var(--signal); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .lab-title-row { align-items: end; display: flex; gap: 24px; justify-content: space-between; margin: 9px 0 30px; }
    .lab-title { font-size: clamp(28px, 4vw, 48px); letter-spacing: -.045em; line-height: .95; max-width: 620px; }
    .lab-source { color: var(--muted); font-size: 12px; max-width: 250px; text-align: right; }
    .best-filter-banner { background: var(--pitch); border: 1px solid var(--signal); margin-bottom: 22px; padding: 18px 22px; }
    .best-filter-title { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; margin-bottom: 12px; text-transform: uppercase; }
    .best-filter-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .best-filter-item { align-items: baseline; background: var(--surface); border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 10px 14px; }
    .best-filter-item.top { border-color: var(--signal); }
    .best-filter-market { color: var(--ink); font-size: 13px; font-weight: 700; }
    .best-filter-cut { color: var(--muted); font-size: 12px; }
    .best-filter-rate { color: var(--signal); font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 800; margin-left: auto; }
    .best-filter-n { color: var(--muted); font-size: 11px; }
    .lab-hero { background: var(--pitch); border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); margin-bottom: 22px; overflow: hidden; }
    .hero-copy { padding: 30px; }
    .hero-market { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .hero-rate { color: var(--signal); font-size: clamp(56px, 10vw, 94px); font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.08em; line-height: .9; margin: 13px 0; }
    .hero-caption { color: var(--muted); font-size: 14px; }
    .hero-facts { border-left: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; }
    .hero-fact { border-bottom: 1px solid var(--line); padding: 24px; }
    .hero-fact:nth-child(odd) { border-right: 1px solid var(--line); }
    .hero-fact-value { color: var(--ink); font-size: 27px; font-variant-numeric: tabular-nums; font-weight: 750; }
    .hero-fact-label { color: var(--muted); font-size: 11px; margin-top: 5px; text-transform: uppercase; }
    .market-strip { display: grid; gap: 8px; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 22px; }
    .market-button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); cursor: pointer; min-height: 95px; padding: 14px; text-align: left; }
    .market-button:hover, .market-button:focus-visible { border-color: rgba(245, 197, 66, .65); outline: none; }
    .market-button.active { background: var(--signal-wash); border-color: var(--signal); }
    .market-name { color: var(--muted); display: block; font-size: 11px; line-height: 1.3; text-transform: uppercase; }
    .market-score { display: block; font-size: 23px; font-variant-numeric: tabular-nums; font-weight: 750; margin-top: 9px; }
    .section-heading { align-items: baseline; display: flex; justify-content: space-between; margin: 32px 0 12px; }
    .section-heading h2 { font-size: 16px; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .threshold-rail { background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
    .threshold { background: none; border: 0; border-right: 1px solid var(--line); color: var(--ink); cursor: pointer; min-height: 145px; padding: 17px; position: relative; text-align: left; }
    .threshold:last-child { border-right: 0; }
    .threshold:hover, .threshold:focus-visible { background: var(--surface-raised); outline: none; }
    .threshold.active { background: var(--signal-wash); }
    .threshold.active::before { background: var(--signal); content: ''; height: 3px; left: 0; position: absolute; right: 0; top: 0; }
    .threshold-cut { color: var(--muted); font-size: 12px; }
    .threshold-rate { display: block; font-size: 30px; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.05em; margin: 18px 0 4px; }
    .threshold-meta { color: var(--muted); font-size: 11px; }
    .lab-results { background: var(--surface); border: 1px solid var(--line); overflow: auto; }
    .result-row { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 12px; grid-template-columns: minmax(220px, 1.6fr) .7fr .55fr .7fr .8fr; min-width: 720px; padding: 13px 18px; }
    .result-row:last-child { border-bottom: 0; }
    .result-row.header { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .fixture { font-size: 13px; font-weight: 650; }
    .fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 3px; }
    .result-number { font-size: 13px; font-variant-numeric: tabular-nums; }
    .outcome { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .outcome.win { color: var(--win); }
    .outcome.loss { color: var(--loss); }
    .outcome.unknown { color: var(--muted); }
    .outcome-pair { display: flex; flex-direction: column; gap: 4px; }
    .lab-note { border-left: 2px solid var(--signal); color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 22px; padding: 12px 15px; }
    .lab-loading { color: var(--muted); padding: 70px 0; text-align: center; }
    .prediction-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .prediction-filter { background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; padding: 8px 12px; }
    .prediction-filter.active, .prediction-filter:hover, .prediction-filter:focus-visible { border-color: var(--signal); color: var(--signal); outline: none; }
    .prediction-runway { border: 1px solid var(--line); }
    .prediction-date { background: var(--pitch); border-bottom: 1px solid var(--line); color: var(--signal); font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 11px 16px; text-transform: uppercase; }
    .prediction-card { align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; gap: 18px; grid-template-columns: 78px minmax(200px, 1fr) 110px 105px 130px; padding: 17px; }
    .prediction-card:last-child { border-bottom: 0; }
    .prediction-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .prediction-fixture { font-size: 14px; font-weight: 700; }
    .prediction-fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 4px; }
    .prediction-probability { color: var(--signal); font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.05em; }
    .prediction-detail { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .prediction-signal { border: 1px solid rgba(95, 210, 139, .4); color: var(--win); font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 7px 8px; text-align: center; text-transform: uppercase; }
    .prediction-signal.monitor { border-color: rgba(245, 197, 66, .45); color: var(--signal); }
    @media (max-width: 800px) { .prediction-card { grid-template-columns: 62px 1fr 80px; } .prediction-detail, .prediction-signal { display: none; } }
    .today-table { border: 1px solid var(--line); overflow-x: auto; }
    .today-row { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 10px; grid-template-columns: 64px minmax(200px, 1fr) 84px repeat(5, 78px) 150px; min-width: 1020px; padding: 12px 16px; }
    .today-row:last-child { border-bottom: 0; }
    .today-row.header { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .today-row.is-live { background: rgba(234, 110, 110, .06); border-left: 2px solid var(--loss); }
    .today-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .today-fixture { font-size: 13px; font-weight: 650; }
    .today-fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 3px; }
    .today-score { font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
    .today-score.muted { color: var(--line); font-weight: 400; }
    .today-score small { color: var(--muted); display: block; font-size: 10px; font-weight: 700; margin-top: 2px; text-transform: uppercase; }
    .today-score.live { color: var(--loss); }
    .today-score.live small { color: var(--loss); }
    .today-chip { border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 4px; text-align: center; }
    .today-chip.strong { background: var(--signal-wash); border-color: var(--signal); color: var(--signal); }
    .today-chip.miss { border-color: var(--loss); color: var(--loss); }
    .today-chip.empty { color: var(--line); }
    .daily-fav-toggle { background: transparent; border: none; color: var(--line); cursor: pointer; font-size: 14px; margin-right: 6px; padding: 0; }
    .daily-fav-toggle.active { color: var(--signal); }
    .daily-date-label { align-items: center; color: var(--muted); display: flex; font-size: 12px; font-weight: 700; gap: 8px; }
    .daily-date-label select { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 12px; font-weight: 700; padding: 8px 10px; }
    .daily-pager { align-items: center; display: flex; gap: 14px; justify-content: center; margin: 14px 0; }
    .daily-pager-label { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .today-signal-cell { font-size: 11px; text-align: center; }
    .today-signal { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); display: inline-block; font-weight: 800; padding: 5px 7px; }
    .today-signal.strong { background: rgba(95, 210, 139, .12); border-color: var(--win); color: var(--win); }
    .today-signal-empty { color: var(--line); }
    .today-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .today-goal-controls { align-items: center; margin-top: -12px; }
    .today-controls-label { color: var(--muted); font-size: 12px; font-weight: 700; margin-right: 4px; }
    .today-market-strip { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .today-refresh { align-items: flex-end; display: flex; flex-direction: column; gap: 6px; }
    .today-refresh-button { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .04em; padding: 10px 16px; text-transform: uppercase; }
    .today-refresh-button:hover:not(:disabled) { background: var(--signal); color: var(--pitch); }
    .today-refresh-button:disabled { cursor: wait; opacity: .6; }
    .today-refresh-meta { color: var(--muted); font-size: 11px; }
    .today-refresh-error { color: var(--loss); font-size: 11px; max-width: 260px; text-align: right; }
    .favorite-star { color: var(--signal); margin-right: 5px; }
    .favorites-search { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13px; margin: 20px 0; padding: 10px 14px; width: 100%; }
    .favorites-search:focus { border-color: var(--signal); outline: none; }
    .favorites-list { border: 1px solid var(--line); }
    .favorite-country-block { border-bottom: 1px solid var(--line); }
    .favorite-country-block:last-child { border-bottom: 0; }
    .favorite-country-header { align-items: center; display: flex; justify-content: space-between; padding: 12px 16px; }
    .favorite-country-header label { align-items: center; cursor: pointer; display: flex; font-size: 14px; gap: 8px; }
    .favorite-expand { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; }
    .favorite-expand:hover { color: var(--signal); }
    .favorite-leagues { background: var(--surface); display: grid; gap: 2px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); padding: 4px 16px 14px 40px; }
    .favorite-league-row { align-items: center; color: var(--muted); cursor: pointer; display: flex; font-size: 13px; gap: 8px; padding: 4px 0; }
    .favorite-league-row:hover { color: var(--ink); }
    .favorite-top-flight { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); font-size: 9px; font-weight: 800; letter-spacing: .05em; padding: 1px 5px; text-transform: uppercase; }
    .favorite-division-b { background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .05em; padding: 1px 5px; text-transform: uppercase; }
    #favoritesMarkTopFlight { margin: 4px 0 0; }
    #favoritesMarkTopFlight:disabled { cursor: default; opacity: .4; }
    .ht-probs { display: flex; gap: 7px; font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .ht-prob { color: var(--ink); }
    .ht-prob.excluded { color: var(--loss); text-decoration: line-through; }
    .ht-exclude-badge { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 5px 8px; text-transform: uppercase; white-space: nowrap; }
    .ht-agreement { border: 1px solid var(--line); color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-weight: 700; padding: 5px 8px; white-space: nowrap; }
    .ht-agreement.full { border-color: var(--win); color: var(--win); }
    .ht-result-row { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 12px; grid-template-columns: 108px minmax(200px, 1.5fr) minmax(150px, 1fr) 130px 110px 90px 90px 90px; min-width: 1080px; padding: 13px 18px; }
    .ht-result-row:last-child { border-bottom: 0; }
    .ht-result-row.header { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .ht-card { align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; gap: 14px; grid-template-columns: 70px minmax(180px, 1fr) 150px 130px 110px; padding: 17px; }
    .ht-card:last-child { border-bottom: 0; }
    @media (max-width: 800px) { .ht-card { grid-template-columns: 56px 1fr; } .ht-card .ht-exclude-badge, .ht-card .ht-agreement { grid-column: 2; } }
    @media (max-width: 900px) { .today-market-strip { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px) {
      .header { align-items: flex-start; flex-wrap: wrap; gap: 14px; }
      .view-tabs { margin-left: 0; order: 3; width: 100%; }
      .controls { flex-wrap: wrap; }
      .lab-title-row, .lab-hero { display: block; }
      .lab-source { margin-top: 15px; text-align: left; }
      .hero-facts { border-left: 0; border-top: 1px solid var(--line); }
      .market-strip { grid-template-columns: repeat(2, 1fr); }
      .threshold-rail { grid-template-columns: 1fr; }
      .threshold { border-bottom: 1px solid var(--line); border-right: 0; min-height: 92px; }
    }
  </style>
</head>
<body>
    <div class="header">
      <div>
        <h1>SokkerPRO</h1>
        <div class="subtitle">Dashboard de Jogos</div>
      </div>
      <div class="view-tabs" aria-label="Visões do dashboard">
        <button class="view-tab active" data-view="dailyView">Lista diária</button>
        <button class="view-tab" data-view="todayView">Hoje</button>
        <button class="view-tab" data-view="predictionsView">Over 0.5 / 1.5</button>
        <button class="view-tab" data-view="htExclusionView">1º Tempo</button>
        <button class="view-tab" data-view="favoritesView">Favoritos</button>
      </div>
  </div>

  <main class="app-view goals-lab" id="todayView">
    <div class="lab-shell" id="todayContent">
      <div class="lab-loading">Carregando jogos de hoje…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="predictionsView">
    <div class="lab-shell" id="predictionsContent">
      <div class="lab-loading">Carregando previsões…</div>
    </div>
  </main>

  <main class="app-view goals-lab active" id="dailyView">
    <div class="lab-shell" id="dailyContent">
      <div class="lab-loading">Carregando lista diária…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="htExclusionView">
    <div class="lab-shell" id="htExclusionContent">
      <div class="lab-loading">Consultando modelo de 1º tempo…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="favoritesView">
    <div class="lab-shell" id="favoritesContent">
      <div class="lab-loading">Carregando países e ligas…</div>
    </div>
  </main>

  <script>
    let predictionThreshold = 80;
    let predictionMode = 'upcoming';
    let activePredictionMarket = 'over_05_ht';
    let activePredictionCombo = null;
    let bestFiltersCache = null;

    const PREDICTION_MARKETS = {
      over_05_ht: {
        tabLabel: 'O0.5 HT',
        badgeLabel: 'O0.5 HT',
        title: 'Over 0.5<br>1º tempo.',
        upcomingEndpoint: '/api/predictions/over-05-ht',
        historyEndpoint: '/api/history/over-05-ht',
        eyebrow: 'previsão pré-jogo × placar HT',
        hitLabel: 'HT',
        companions: [
          { key: 'ftHit', label: 'FT' },
          { key: 'by75Hit', label: "75'" },
        ],
        // Validado: FT≥90 + BTTS≥60 sobe o acerto de HT de ~72% pra ~77% (n~360) sem perder o FT (~95%).
        combos: [
          { key: 'ft90_btts60', label: 'Combo FT90+BTTS60', threshold: 70, test: r => (r.companionProbability ?? 0) >= 90 && (r.bttsPercentage ?? 0) >= 60 },
        ],
      },
      over_15_ht: {
        tabLabel: 'O1.5 HT',
        badgeLabel: 'O1.5 HT',
        title: 'Over 1.5<br>1º tempo.',
        upcomingEndpoint: '/api/predictions/over-15-ht',
        historyEndpoint: '/api/history/over-15-ht',
        eyebrow: 'previsão pré-jogo × placar HT',
        hitLabel: 'HT',
        companions: [
          { key: 'ftHit', label: 'FT' },
        ],
      },
      over_05_ft: {
        tabLabel: 'O0.5 FT',
        badgeLabel: 'O0.5 FT',
        title: 'Over 0.5<br>final.',
        upcomingEndpoint: '/api/predictions/over-05-ft',
        historyEndpoint: '/api/history/over-05-ft',
        eyebrow: 'previsão pré-jogo × placar final',
        hitLabel: 'FT',
        companions: [
          { key: 'htHit', label: 'HT' },
          { key: 'by75Hit', label: "75'" },
        ],
      },
      over_15_ft: {
        tabLabel: 'O1.5 FT',
        badgeLabel: 'O1.5 FT',
        title: 'Over 1.5<br>final.',
        upcomingEndpoint: '/api/predictions/over-15-ft-signal',
        historyEndpoint: '/api/history/over-15-ft-signal',
        eyebrow: 'previsão pré-jogo × placar final · 4 sinais',
        hitLabel: 'O1.5',
        companions: [
          { key: 'hitOver05', label: 'O0.5' },
        ],
        // Nossa melhor estratégia: busca exaustiva (2286 jogos) achou score≥2/4 = 83.5%
        // (base sem filtro ~73%). Sinais: O2.5FT≥70, BTTS≥65, média gols≥3.8, O0.5%times≥90.
        combos: [
          { key: 'score2', label: 'Score ≥2/4 (melhor estratégia)', threshold: 0, test: r => (r.signalScore ?? 0) >= 2 },
        ],
      },
      under_35_ft: {
        tabLabel: 'U3.5 FT',
        badgeLabel: 'U3.5 FT',
        title: 'Under 3.5<br>final.',
        upcomingEndpoint: '/api/predictions/under-35-ft',
        historyEndpoint: '/api/history/under-35-ft',
        eyebrow: 'previsão pré-jogo × placar final',
        hitLabel: '',
        companions: [],
      },
    };

    // Favoritos vivem no Postgres (compartilhado entre todos os navegadores/computadores)
    // desde que alguém abriu o dashboard depois dessa mudança. Antes viviam só no
    // localStorage — cada máquina com sua própria lista, sem sincronia nenhuma, e foi
    // exatamente esse o motivo de dois computadores mostrarem resultados diferentes.
    const FAVORITES_STORAGE_KEY = 'sokkerpro:favorites';
    async function loadFavorites() {
      try {
        const response = await fetch('/api/favorites');
        if (!response.ok) throw new Error('Banco local indisponível');
        const dbFavorites = await response.json();
        if (dbFavorites.countries.length || dbFavorites.leagues.length) {
          favorites = dbFavorites;
          return;
        }
        // Banco vazio: se este navegador já tinha favoritos salvos do jeito antigo
        // (localStorage), usa como semente única pro banco compartilhado. A partir daqui
        // o banco é a fonte da verdade — outros navegadores convergem pra essa lista.
        const legacyRaw = localStorage.getItem(FAVORITES_STORAGE_KEY);
        const legacy = legacyRaw ? JSON.parse(legacyRaw) : null;
        if (legacy && (legacy.countries?.length || legacy.leagues?.length)) {
          favorites = { countries: legacy.countries || [], leagues: legacy.leagues || [] };
          await saveFavorites();
        } else {
          favorites = dbFavorites;
        }
      } catch {
        // Sem banco disponível — mantém o que já estava em memória (vazio no primeiro load).
      }
    }
    async function saveFavorites() {
      try {
        await fetch('/api/favorites', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(favorites),
        });
      } catch {
        // Falha ao salvar fica só nesta sessão; próxima carga volta pro que já tava no banco.
      }
    }
    let favorites = { countries: [], leagues: [] };
    const favoritesReady = loadFavorites(); // dispara uma vez só; todo consumidor espera essa mesma promise
    let knownLeagues = [];
    let favoritesSearchTerm = '';
    let favoriteLeaguesMigrated = false;
    const expandedFavoriteCountries = new Set();
    // "país::competição" — não só o nome, porque nomes de liga colidem entre países
    // (ex.: "Premier League" existe em Ucrânia, Rússia, Gales, Cazaquistão...).
    const favoriteLeagueKey = (country, competition) => `${country ?? ''}::${competition ?? ''}`;
    const isFavoriteMatch = match => favorites.countries.includes(match.country) || favorites.leagues.includes(favoriteLeagueKey(match.country, match.competition));

    // Favoritos antigos guardavam só o nome da competição (sem país) — migra pra
    // "país::competição" na primeira vez que a lista de ligas conhecidas chegar. Nome que
    // bate 0 ou 2+ países é descartado (ambíguo: não dá pra saber qual país era a intenção);
    // o usuário remarca manualmente na aba Favoritos se precisar.
    function migrateLegacyFavoriteLeagues() {
      if (favoriteLeaguesMigrated || !knownLeagues.length) return;
      favoriteLeaguesMigrated = true;
      const isLegacyEntry = entry => !entry.includes('::');
      const legacy = favorites.leagues.filter(isLegacyEntry);
      if (!legacy.length) return;
      const migrated = legacy.flatMap(competition => {
        const matches = knownLeagues.filter(l => l.competition === competition);
        return matches.length === 1 ? [favoriteLeagueKey(matches[0].country, competition)] : [];
      });
      favorites.leagues = [...favorites.leagues.filter((entry) => !isLegacyEntry(entry)), ...migrated];
      saveFavorites();
    }
    (async () => {
      try {
        const response = await fetch('/api/leagues');
        if (response.ok) {
          knownLeagues = await response.json();
          await favoritesReady; // senão a migração roda cedo demais, sobre o placeholder vazio
          migrateLegacyFavoriteLeagues();
        }
      } catch {
        // Favoritos tab tenta de novo quando aberta; não bloqueia o resto do dashboard.
      }
    })();

    async function renderFavorites() {
      const content = document.getElementById('favoritesContent');
      if (!knownLeagues.length) content.innerHTML = '<div class="lab-loading">Carregando países e ligas…</div>';
      try {
        // Refetches every time this tab opens (not just once) so leagues/countries
        // that get scraped for the first time later (e.g. a league starting its
        // season) show up here without needing a full page reload.
        const response = await fetch('/api/leagues');
        if (!response.ok) throw new Error('Banco local indisponível');
        knownLeagues = await response.json();
        migrateLegacyFavoriteLeagues();
      } catch (error) {
        if (!knownLeagues.length) {
          content.innerHTML = `<div class="empty">Não foi possível carregar países e ligas: ${error.message}</div>`;
          return;
        }
      }
      renderFavoritesUI();
    }

    function renderFavoritesUI() {
      const content = document.getElementById('favoritesContent');
      const term = favoritesSearchTerm.trim().toLowerCase();
      const byCountry = new Map();
      knownLeagues.forEach(({ country, competition, isTopFlight, division }) => {
        (byCountry.get(country) ?? byCountry.set(country, []).get(country)).push({ competition, isTopFlight, division });
      });
      const groups = [...byCountry.entries()]
        .map(([country, leagues]) => ({ country, leagues }))
        .filter(group => !term || group.country.toLowerCase().includes(term) || group.leagues.some(l => l.competition.toLowerCase().includes(term)))
        .sort((a, b) => a.country.localeCompare(b.country));

      const curatedAvailable = groups.filter(g => g.leagues.some(l => l.division));
      const curatedMissing = curatedAvailable.filter(g => !g.leagues.some(l => l.division && favorites.leagues.includes(favoriteLeagueKey(g.country, l.competition)))).length;
      const divisionRank = { A: 0, B: 1 };
      const rankOf = l => l.division ? divisionRank[l.division] : 2;

      const rows = groups.map(group => {
        const expanded = expandedFavoriteCountries.has(group.country);
        const countryChecked = favorites.countries.includes(group.country);
        const sortedLeagues = [...group.leagues].sort((a, b) => rankOf(a) - rankOf(b) || a.competition.localeCompare(b.competition));
        const leagueRows = sortedLeagues.map(({ competition, division }) => `
          <label class="favorite-league-row"><input type="checkbox" data-fav-league="${favoriteLeagueKey(group.country, competition)}" ${favorites.leagues.includes(favoriteLeagueKey(group.country, competition)) ? 'checked' : ''}> ${competition}${division === 'A' ? ' <span class="favorite-top-flight">A</span>' : division === 'B' ? ' <span class="favorite-division-b">B</span>' : ''}</label>
        `).join('');
        return `
          <div class="favorite-country-block">
            <div class="favorite-country-header">
              <label><input type="checkbox" data-fav-country="${group.country}" ${countryChecked ? 'checked' : ''}> <strong>${group.country}</strong></label>
              <button class="favorite-expand" data-toggle-country="${group.country}">${expanded ? '▾' : '▸'} ${group.leagues.length} liga${group.leagues.length === 1 ? '' : 's'}</button>
            </div>
            ${expanded ? `<div class="favorite-leagues">${leagueRows}</div>` : ''}
          </div>`;
      }).join('');

      content.innerHTML = `
        <div class="lab-eyebrow">Configuração · salvo neste navegador</div>
        <div class="lab-title-row"><h1 class="lab-title">Países e ligas<br>favoritas.</h1><p class="lab-source">${favorites.countries.length} país(es) e ${favorites.leagues.length} liga(s) marcadas. Usado pra destacar (★) e filtrar jogos na aba Hoje.</p></div>
        <button class="today-refresh-button" id="favoritesMarkTopFlight" ${curatedMissing === 0 ? 'disabled' : ''}>★ Marcar ${curatedMissing || ''} país(es) com ligas A/B conhecidas</button>
        <input type="text" class="favorites-search" id="favoritesSearch" placeholder="Buscar país ou liga…" value="${favoritesSearchTerm}">
        <div class="favorites-list">${rows || '<div class="empty">Nenhum país/liga encontrado.</div>'}</div>`;

      const searchInput = document.getElementById('favoritesSearch');
      searchInput.addEventListener('input', () => { favoritesSearchTerm = searchInput.value; renderFavoritesUI(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); });
      content.querySelectorAll('[data-fav-country]').forEach(box => box.addEventListener('change', () => {
        const country = box.dataset.favCountry;
        favorites.countries = box.checked ? [...favorites.countries, country] : favorites.countries.filter(c => c !== country);
        saveFavorites();
        renderFavoritesUI();
      }));
      content.querySelectorAll('[data-fav-league]').forEach(box => box.addEventListener('change', () => {
        const key = box.dataset.favLeague;
        favorites.leagues = box.checked ? [...favorites.leagues, key] : favorites.leagues.filter(l => l !== key);
        saveFavorites();
        renderFavoritesUI();
      }));
      content.querySelectorAll('[data-toggle-country]').forEach(button => button.addEventListener('click', () => {
        const country = button.dataset.toggleCountry;
        if (expandedFavoriteCountries.has(country)) expandedFavoriteCountries.delete(country);
        else expandedFavoriteCountries.add(country);
        renderFavoritesUI();
      }));
      const markTopFlightButton = document.getElementById('favoritesMarkTopFlight');
      if (markTopFlightButton) markTopFlightButton.addEventListener('click', () => {
        const toAdd = curatedAvailable
          .flatMap(g => g.leagues.filter(l => l.division).map(l => favoriteLeagueKey(g.country, l.competition)))
          .filter(key => !favorites.leagues.includes(key));
        favorites.leagues = [...favorites.leagues, ...toAdd];
        saveFavorites();
        renderFavoritesUI();
      });
    }

    const TODAY_MARKETS = [
      { key: 'gols_1t_05_over', label: 'O0.5 HT' },
      { key: 'gols_1t_15_over', label: 'O1.5 HT' },
      { key: 'over_05_ft_over', label: 'O0.5 FT' },
      { key: 'over_15_ft_over', label: 'O1.5 FT' },
    ];
    let todayMinProbability = 0;
    let todayFocusMarket = 'gols_1t_05_over';
    let todayGoalFilter = 'all';
    let todayFavoritesOnly = false;
    let todayMatches = [];

    const GOAL_FILTERS = [
      { key: 'all', label: 'Todos' },
      { key: '0', label: '0 gols' },
      { key: '0.5', label: '≥ 0.5' },
      { key: '1.5', label: '≥ 1.5' },
      { key: '2.5', label: '≥ 2.5' },
    ];
    const matchesGoalFilter = match => {
      if (todayGoalFilter === 'all') return true;
      if (match.homeScore === undefined || match.homeScore === null) return false;
      const total = match.homeScore + (match.awayScore ?? 0);
      return todayGoalFilter === '0' ? total === 0 : total >= Math.ceil(Number(todayGoalFilter));
    };
    let todayRefreshing = false;
    let todayLastUpdated = null;
    let todayRefreshError = null;

    const OPEN_STATUSES = new Set(['1st', '2nd', 'et', 'half_time', 'live']);
    const isOpenStatus = status => OPEN_STATUSES.has(status);

    // Sinais validados para "0x0 aos 30' -> sai gol até 75'", do mais para o menos assertivo.
    const ZERO_AT_30_LIVE_CHECKS = [
      { label: "BTTS%times ≥70", test: s => (s.bttsPercentage ?? 0) >= 70, tier: 'strong' },
      { label: 'Score 4/4', test: s => (s.signalScore ?? 0) >= 4, tier: 'strong' },
      { label: 'Combo 91%', test: s => s.over25FtProbability >= 60 && s.combinedGoalsAverage >= 3.4 && s.bttsPercentage >= 60, tier: 'strong' },
      { label: 'Score ≥3', test: s => (s.signalScore ?? 0) >= 3, tier: '' },
      { label: 'Combo 89%', test: s => s.over25FtProbability >= 60 && s.bttsProbability >= 55 && s.bttsPercentage >= 55, tier: '' },
    ];
    const parseLiveMinute = liveMinute => {
      const match = /^(\d+)/.exec(liveMinute || '');
      return match ? Number(match[1]) : undefined;
    };
    const isZeroAt30Live = match => {
      // 'et'/extra_time: janela dos 75' já fechou (0x0 até lá já foi red) — fora.
      if (!isOpenStatus(match.status) || match.status === 'et') return false;
      if (match.homeScore !== 0 || match.awayScore !== 0) return false;
      if (match.status === 'half_time') return true;
      const minute = parseLiveMinute(match.liveMinute);
      return minute !== undefined && minute >= 30 && minute <= 75;
    };
    const zeroAt30Badge = match => {
      if (!isZeroAt30Live(match)) return '<span class="today-signal-empty">—</span>';
      const signals = {
        over25FtProbability: match.predictions['over_25_ft_over']?.probability ?? 0,
        bttsProbability: match.predictions['btts_sim']?.probability ?? 0,
        bttsPercentage: match.bttsPercentage,
        combinedGoalsAverage: match.combinedGoalsAverage,
        signalScore: match.signalScore,
      };
      const hit = ZERO_AT_30_LIVE_CHECKS.find(check => check.test(signals));
      return hit
        ? `<span class="today-signal ${hit.tier}">0x0/30' · ${hit.label}</span>`
        : `<span class="today-signal-empty">0x0/30' · sem sinal</span>`;
    };

    const scoreCell = match => {
      if (match.homeScore === undefined || match.homeScore === null) return '<div class="today-score muted">—</div>';
      const placar = `${match.homeScore}–${match.awayScore ?? 0}`;
      if (isOpenStatus(match.status)) return `<div class="today-score live">${placar}<small>${match.liveMinute ? `${match.liveMinute}'` : 'ao vivo'}</small></div>`;
      if (match.status === 'finished') return `<div class="today-score">${placar}<small>fim</small></div>`;
      return `<div class="today-score">${placar}</div>`;
    };

    async function refreshToday() {
      todayRefreshing = true;
      todayRefreshError = null;
      renderTodayUI();
      try {
        const response = await fetch('/api/today/refresh', { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Falha ao atualizar');
        todayMatches = payload.matches;
        todayLastUpdated = payload.updatedAt;
      } catch (error) {
        todayRefreshError = error.message;
      }
      todayRefreshing = false;
      renderTodayUI();
    }

    async function renderToday() {
      const content = document.getElementById('todayContent');
      content.innerHTML = '<div class="lab-loading">Carregando jogos de hoje…</div>';
      try {
        const response = await fetch('/api/today');
        if (!response.ok) throw new Error('Banco local indisponível');
        todayMatches = await response.json();
        renderTodayUI();
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar os jogos de hoje: ${error.message}</div>`;
      }
    }

    function renderTodayUI() {
      const content = document.getElementById('todayContent');
      const filters = [0, 60, 70, 75, 80].map(threshold => `<button class="prediction-filter ${threshold === todayMinProbability ? 'active' : ''}" data-today-threshold="${threshold}">${threshold ? `≥ ${threshold}%` : 'Todos'}</button>`).join('');

      const marketButtons = [{ key: 'all', label: 'Todos os mercados' }, ...TODAY_MARKETS].map(market => {
        const count = market.key === 'all'
          ? todayMatches.filter(match => TODAY_MARKETS.some(m => (match.predictions[m.key]?.probability ?? 0) >= 80)).length
          : todayMatches.filter(match => (match.predictions[market.key]?.probability ?? 0) >= 80).length;
        return `<button class="market-button ${market.key === todayFocusMarket ? 'active' : ''}" data-today-market="${market.key}"><span class="market-name">${market.label}</span><span class="market-score">${count}</span></button>`;
      }).join('');

      const matchesInThreshold = todayMatches.filter(match => {
        const probabilityOk = !todayMinProbability || (todayFocusMarket === 'all'
          ? TODAY_MARKETS.some(market => (match.predictions[market.key]?.probability ?? 0) >= todayMinProbability)
          : (match.predictions[todayFocusMarket]?.probability ?? 0) >= todayMinProbability);
        return probabilityOk && matchesGoalFilter(match) && (!todayFavoritesOnly || isFavoriteMatch(match));
      });

      const goalFilters = GOAL_FILTERS.map(filter => `<button class="prediction-filter ${filter.key === todayGoalFilter ? 'active' : ''}" data-today-goal-filter="${filter.key}">${filter.label}</button>`).join('');
      const favoritesToggle = `<button class="prediction-filter ${todayFavoritesOnly ? 'active' : ''}" id="todayFavoritesToggle">★ Só favoritos</button>`;

      const openCount = todayMatches.filter(match => isOpenStatus(match.status)).length;
      const header = `<div class="today-row header"><div>Horário</div><div>Partida</div><div>Placar</div>${TODAY_MARKETS.map(m => `<div>${m.label}</div>`).join('')}<div>Sinal 0x0/30'</div></div>`;
      const rowHtml = match => {
        const time = match.kickoffAt ? formatKickoff(match.kickoffAt) : '—';
        const chips = TODAY_MARKETS.map(market => {
          const prediction = match.predictions[market.key];
          const probability = prediction?.probability;
          if (probability === undefined) return '<div class="today-chip empty">—</div>';
          return `<div class="today-chip ${probability >= 80 ? 'strong' : ''}">${probability}%</div>`;
        }).join('');
        const star = isFavoriteMatch(match) ? '<span class="favorite-star">★</span>' : '';
        return `<div class="today-row ${isOpenStatus(match.status) ? 'is-live' : ''}"><div class="today-time">${time}</div><div class="today-fixture">${star}${match.homeTeam} × ${match.awayTeam}<small>${competitionLabel(match)}</small></div>${scoreCell(match)}${chips}<div class="today-signal-cell">${zeroAt30Badge(match)}</div></div>`;
      };

      const matchBucket = match => {
        if (isOpenStatus(match.status)) return 'andamento';
        if (match.status === 'not_started') return 'proximos';
        return 'finalizados';
      };
      const buckets = { andamento: [], finalizados: [], proximos: [] };
      matchesInThreshold.forEach(match => buckets[matchBucket(match)].push(match));

      const block = (title, list) => `
        <div class="section-heading"><h2>${title}</h2><span>${list.length} jogo${list.length === 1 ? '' : 's'}</span></div>
        <section class="today-table">${header}${list.map(rowHtml).join('') || '<div class="empty">Nenhum jogo nesse bloco.</div>'}</section>`;

      const focusLabel = todayFocusMarket === 'all' ? 'qualquer mercado' : TODAY_MARKETS.find(m => m.key === todayFocusMarket).label;
      const updatedLabel = todayLastUpdated ? `Atualizado às ${formatKickoff(todayLastUpdated)}` : 'Ainda não atualizado ao vivo';
      const refreshError = todayRefreshError ? `<div class="today-refresh-error">${todayRefreshError}</div>` : '';
      content.innerHTML = `
        <div class="lab-eyebrow">Hoje · ordenado por horário · somente ligas principais</div>
        <div class="lab-title-row">
          <h1 class="lab-title">Jogos de<br>hoje.</h1>
          <div class="today-refresh">
            <button class="today-refresh-button" id="todayRefreshButton" ${todayRefreshing ? 'disabled' : ''}>${todayRefreshing ? 'Atualizando…' : `Atualizar (${openCount} em aberto)`}</button>
            <span class="today-refresh-meta">${updatedLabel}</span>
            ${refreshError}
          </div>
        </div>
        <p class="lab-source">${matchesInThreshold.length} de ${todayMatches.length} jogos hoje batem o corte em ${focusLabel}. Chip destacado = previsão do modelo ≥ 80%.</p>
        <div class="market-strip today-market-strip">${marketButtons}</div>
        <div class="today-controls">${filters}</div>
        <div class="today-controls today-goal-controls"><span class="today-controls-label">Gols no jogo:</span>${goalFilters}${favoritesToggle}</div>
        ${block('Em andamento', buckets.andamento)}
        ${block('Finalizados', buckets.finalizados)}
        ${block('Próximos', buckets.proximos)}
        <p class="lab-note">Horário em Brasília. A odd exibida pelo modelo não é uma cotação real de aposta. "Atualizar" busca placar e minuto ao vivo direto da SokkerPRO.</p>`;
      content.querySelectorAll('[data-today-market]').forEach(button => button.addEventListener('click', () => { todayFocusMarket = button.dataset.todayMarket; renderTodayUI(); }));
      content.querySelectorAll('[data-today-threshold]').forEach(button => button.addEventListener('click', () => { todayMinProbability = Number(button.dataset.todayThreshold); renderTodayUI(); }));
      content.querySelectorAll('[data-today-goal-filter]').forEach(button => button.addEventListener('click', () => { todayGoalFilter = button.dataset.todayGoalFilter; renderTodayUI(); }));
      const refreshButton = document.getElementById('todayRefreshButton');
      if (refreshButton) refreshButton.addEventListener('click', refreshToday);
      const favoritesToggleButton = document.getElementById('todayFavoritesToggle');
      if (favoritesToggleButton) favoritesToggleButton.addEventListener('click', () => { todayFavoritesOnly = !todayFavoritesOnly; renderTodayUI(); });
    }

    const formatKickoff = kickoffAt => new Date(kickoffAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
    const formatDate = kickoffAt => new Date(kickoffAt).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    const formatKickoffShort = kickoffAt => kickoffAt
      ? new Date(kickoffAt).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' })
      : '—';
    const competitionLabel = match => match.competition
      ? (match.country ? `${match.country} · ${match.competition}` : match.competition)
      : 'Competição não informada';

    let dailyPicks = [];
    let dailyMode = 'top10'; // 'top10' | 'top10fav' | 'favorites' | 'all'
    let dailyDate = null;
    let dailyPage = 0;
    let dailyRefreshing = false;
    let dailyRefreshError = null;
    const DAILY_PAGE_SIZE = 20;
    const toBrasiliaDateStr = kickoffAt => {
      const timestamp = new Date(kickoffAt).getTime();
      return new Date(timestamp - 3 * 60 * 60 * 1000).toISOString().slice(0, 10);
    };
    const formatPickerDate = dateStr => new Date(dateStr + 'T12:00:00Z').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo' });

    async function renderDaily() {
      const content = document.getElementById('dailyContent');
      content.innerHTML = '<div class="lab-loading">Carregando lista diária…</div>';
      try {
        const response = await fetch('/api/daily-picks');
        if (!response.ok) throw new Error('Banco local indisponível');
        dailyPicks = await response.json();
        renderDailyUI();
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar a lista diária: ${error.message}</div>`;
      }
    }

    // Busca placar/status atualizados na SokkerPRO pro dia selecionado (rápido, ~1
    // chamada) e recarrega os picks. Dias antigos que ficaram "not_started" porque o
    // scraper não rodou na hora certa se corrigem sozinhos ao clicar aqui.
    async function refreshDaily() {
      dailyRefreshing = true;
      dailyRefreshError = null;
      renderDailyUI();
      try {
        const response = await fetch(`/api/today/refresh?date=${dailyDate}`, { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Falha ao atualizar');
        const picksResponse = await fetch('/api/daily-picks');
        if (!picksResponse.ok) throw new Error('Banco local indisponível');
        dailyPicks = await picksResponse.json();
      } catch (error) {
        dailyRefreshError = error.message;
      }
      dailyRefreshing = false;
      renderDailyUI();
    }

    // Filtro validado por backtest (876 jogos, 14 dias): O0.5FT>=85 + U3.5FT<=70
    // rende ~93-94% de acerto no Over0.5FT mantendo alto volume (~44 jogos/dia).
    function renderDailyUI() {
      const content = document.getElementById('dailyContent');
      const withPrediction = dailyPicks.filter(pick => pick.over05 !== undefined && pick.under35 !== undefined && pick.kickoffAt);
      const availableDates = [...new Set(withPrediction.map(pick => toBrasiliaDateStr(pick.kickoffAt)))].sort((a, b) => b.localeCompare(a));
      const todayStr = toBrasiliaDateStr(new Date().toISOString());
      if (!dailyDate || !availableDates.includes(dailyDate)) dailyDate = availableDates.includes(todayStr) ? todayStr : (availableDates[0] ?? todayStr);

      const dayPicks = withPrediction.filter(pick => toBrasiliaDateStr(pick.kickoffAt) === dailyDate);
      const candidates = dayPicks
        .filter(pick => pick.over05 >= 85 && pick.under35 <= 70)
        .sort((a, b) => (b.over05 - a.over05) || (a.under35 - b.under35));

      const favoriteCandidates = candidates.filter(isFavoriteMatch);
      const selected = (dailyMode === 'top10' ? candidates.slice(0, 10)
        : dailyMode === 'top10fav' ? favoriteCandidates.slice(0, 10)
        : dailyMode === 'favorites' ? favoriteCandidates
        : candidates
      ).slice().sort((a, b) => (a.kickoffAt ?? '').localeCompare(b.kickoffAt ?? ''));

      const dateOptions = availableDates.map(date => `<option value="${date}" ${date === dailyDate ? 'selected' : ''}>${formatPickerDate(date)}${date === todayStr ? ' (hoje)' : ''}</option>`).join('');
      const dateIndex = availableDates.indexOf(dailyDate);
      const olderDate = availableDates[dateIndex + 1];
      const newerDate = availableDates[dateIndex - 1];
      const modeButtons = [
        { key: 'top10', label: 'Top 10' },
        { key: 'top10fav', label: 'Top 10 favoritas' },
        { key: 'favorites', label: 'Ligas favoritas' },
        { key: 'all', label: 'Todos' },
      ].map(mode => `<button class="prediction-filter ${dailyMode === mode.key ? 'active' : ''}" data-daily-mode="${mode.key}">${mode.label}</button>`).join('');

      const totalPages = Math.max(1, Math.ceil(selected.length / DAILY_PAGE_SIZE));
      if (dailyPage >= totalPages) dailyPage = totalPages - 1;
      if (dailyPage < 0) dailyPage = 0;
      const pageItems = selected.slice(dailyPage * DAILY_PAGE_SIZE, (dailyPage + 1) * DAILY_PAGE_SIZE);

      const header = `<div class="today-row header"><div>Horário</div><div>Partida</div><div>Placar</div><div>O0.5 FT</div><div>U3.5 FT</div><div>O1.5 FT</div><div>O2.5 FT</div></div>`;
      const rowHtml = pick => {
        const time = pick.kickoffAt ? formatKickoff(pick.kickoffAt) : '—';
        const fav = isFavoriteMatch(pick);
        const finished = pick.finalGoals !== undefined;
        const scoreCell = finished ? `<div class="today-score">${pick.homeScore}–${pick.awayScore}</div>` : '<div class="today-score muted">—</div>';
        const outcomeChip = (probability, hit, threshold) => finished
          ? `<div class="today-chip ${hit ? 'strong' : 'miss'}">${hit ? '✓' : '✕'} ${probability ?? '—'}${probability !== undefined ? '%' : ''}</div>`
          : (probability === undefined ? '<div class="today-chip empty">—</div>' : `<div class="today-chip ${probability >= threshold ? 'strong' : ''}">${probability}%</div>`);
        return `<div class="today-row">
          <div>${time}</div>
          <div>
            <button class="daily-fav-toggle ${fav ? 'active' : ''}" data-daily-toggle-fav="${favoriteLeagueKey(pick.country, pick.competition)}" title="${fav ? 'Remover liga dos favoritos' : 'Marcar liga como favorita'}">${fav ? '★' : '☆'}</button>
            ${pick.homeTeam} × ${pick.awayTeam}<small>${competitionLabel(pick)}</small>
          </div>
          ${scoreCell}
          ${outcomeChip(pick.over05, pick.finalGoals >= 1, 85)}
          ${outcomeChip(pick.under35, pick.finalGoals <= 3, 70)}
          ${outcomeChip(pick.over15, pick.finalGoals >= 2, 80)}
          ${outcomeChip(pick.over25, pick.finalGoals >= 3, 70)}
        </div>`;
      };

      const hits = selected.filter(pick => pick.finalGoals !== undefined && pick.finalGoals >= 1).length;
      const settledCount = selected.filter(pick => pick.finalGoals !== undefined).length;
      const resultSummary = settledCount ? `<p class="lab-source">Resultado do dia: ${hits}/${settledCount} green no Over0.5FT (${Math.round(100 * hits / settledCount)}%).</p>` : '';

      const pager = `<div class="daily-pager">
        <button class="prediction-filter" id="dailyPagePrev" ${dailyPage === 0 ? 'disabled' : ''}>‹ Anterior</button>
        <span class="daily-pager-label">Página ${dailyPage + 1} de ${totalPages}</span>
        <button class="prediction-filter" id="dailyPageNext" ${dailyPage >= totalPages - 1 ? 'disabled' : ''}>Próxima ›</button>
      </div>`;

      content.innerHTML = `
        <div class="lab-eyebrow">Lista diária · filtro validado O0.5FT≥85% + U3.5FT≤70% · somente ligas principais</div>
        <div class="lab-title-row">
          <h1 class="lab-title">Entradas por<br>dia.</h1>
        </div>
        <div class="today-controls">
          <button class="prediction-filter" id="dailyDatePrev" ${olderDate ? '' : 'disabled'}>‹ Dia anterior</button>
          <label class="daily-date-label">Dia: <select id="dailyDateSelect">${dateOptions}</select></label>
          <button class="prediction-filter" id="dailyDateNext" ${newerDate ? '' : 'disabled'}>Dia seguinte ›</button>
          <button class="today-refresh-button" id="dailyRefreshButton" ${dailyRefreshing ? 'disabled' : ''}>${dailyRefreshing ? 'Atualizando…' : '↻ Atualizar placares'}</button>
          ${dailyRefreshError ? `<span class="today-refresh-error">${dailyRefreshError}</span>` : ''}
        </div>
        <p class="lab-source">${candidates.length} jogos batem o filtro nesse dia (${favoriteCandidates.length} em ligas favoritas). Mostrando ${selected.length}${dailyMode === 'top10' || dailyMode === 'top10fav' ? ' (top 10 por Over0.5FT, desempate por Under3.5FT)' : ''}.</p>
        <div class="today-controls">${modeButtons}</div>
        ${resultSummary}
        ${pager}
        <section class="today-table">${header}${pageItems.map(rowHtml).join('') || '<div class="empty">Nenhum jogo bate o filtro nesse dia/modo.</div>'}</section>
        ${pager}
        <p class="lab-note">Horário em Brasília. ✓/✕ e placar aparecem quando o jogo já terminou. Clique na estrela pra marcar/desmarcar a liga como favorita. Filtro validado historicamente em ~93-94% de acerto no Over0.5FT (~77% Over1.5FT, ~58% Over2.5FT na mesma seleção).</p>`;

      const dateSelect = document.getElementById('dailyDateSelect');
      if (dateSelect) dateSelect.addEventListener('change', () => { dailyDate = dateSelect.value; dailyPage = 0; renderDailyUI(); });
      const datePrevButton = document.getElementById('dailyDatePrev');
      if (datePrevButton) datePrevButton.addEventListener('click', () => { if (olderDate) { dailyDate = olderDate; dailyPage = 0; renderDailyUI(); } });
      const dateNextButton = document.getElementById('dailyDateNext');
      if (dateNextButton) dateNextButton.addEventListener('click', () => { if (newerDate) { dailyDate = newerDate; dailyPage = 0; renderDailyUI(); } });
      const refreshButton = document.getElementById('dailyRefreshButton');
      if (refreshButton) refreshButton.addEventListener('click', refreshDaily);
      content.querySelectorAll('[data-daily-mode]').forEach(button => button.addEventListener('click', () => { dailyMode = button.dataset.dailyMode; dailyPage = 0; renderDailyUI(); }));
      content.querySelectorAll('#dailyPagePrev').forEach(button => button.addEventListener('click', () => { dailyPage -= 1; renderDailyUI(); }));
      content.querySelectorAll('#dailyPageNext').forEach(button => button.addEventListener('click', () => { dailyPage += 1; renderDailyUI(); }));
      content.querySelectorAll('[data-daily-toggle-fav]').forEach(button => button.addEventListener('click', () => {
        const key = button.dataset.dailyToggleFav;
        if (!key) return;
        favorites.leagues = favorites.leagues.includes(key) ? favorites.leagues.filter(l => l !== key) : [...favorites.leagues, key];
        saveFavorites();
        renderDailyUI();
      }));
    }

    // Varre os 4 mercados × a escada de corte, pega o melhor par (corte, mercado) por
    // acerto histórico exigindo volume mínimo (n>=20) pra não recomendar corte raro.
    async function computeBestFilters() {
      const thresholds = [70, 75, 80, 85, 90];
      const results = await Promise.all(Object.entries(PREDICTION_MARKETS).map(async ([key, market]) => {
        try {
          const response = await fetch(market.historyEndpoint);
          if (!response.ok) return null;
          const records = await response.json();
          let best = null;
          for (const threshold of thresholds) {
            const selected = records.filter(record => record.probability >= threshold);
            if (selected.length < 20) continue;
            const hits = selected.filter(record => record.hit).length;
            const accuracy = Math.round((hits / selected.length) * 100);
            if (!best || accuracy > best.accuracy || (accuracy === best.accuracy && selected.length > best.n)) {
              best = { threshold, accuracy, n: selected.length };
            }
          }
          return best ? { key, label: market.tabLabel, ...best } : null;
        } catch {
          return null;
        }
      }));
      return results.filter(Boolean).sort((a, b) => b.accuracy - a.accuracy);
    }

    async function renderPredictions() {
      const content = document.getElementById('predictionsContent');
      content.innerHTML = '<div class="lab-loading">Consultando sinais no banco local…</div>';
      try {
        const config = PREDICTION_MARKETS[activePredictionMarket];
        const endpoint = predictionMode === 'upcoming'
          ? `${config.upcomingEndpoint}?minProbability=${predictionThreshold}`
          : config.historyEndpoint;
        if (!bestFiltersCache) bestFiltersCache = computeBestFilters();
        const [response, bestFilters] = await Promise.all([fetch(endpoint), bestFiltersCache]);
        if (!response.ok) throw new Error('Banco local indisponível');
        const records = await response.json();
        const activeCombo = predictionMode === 'history' && config.combos
          ? config.combos.find(combo => combo.key === activePredictionCombo)
          : undefined;
        const selected = predictionMode === 'upcoming'
          ? records
          : records.filter(record => record.probability >= predictionThreshold && (!activeCombo || activeCombo.test(record)));
        const bestFilterBanner = bestFilters.length ? `<section class="best-filter-banner"><div class="best-filter-title">🎯 Melhor filtro pra entrar (maior acerto histórico, mín. 20 jogos)</div><div class="best-filter-list">${bestFilters.map((b, i) => `<div class="best-filter-item ${i === 0 ? 'top' : ''}"><span class="best-filter-market">${b.label}</span><span class="best-filter-cut">≥ ${b.threshold}%</span><span class="best-filter-rate">${b.accuracy}%</span><span class="best-filter-n">${b.n} jogos</span></div>`).join('')}</div></section>` : '';
        const markets = Object.entries(PREDICTION_MARKETS).map(([key, market]) => `<button class="prediction-filter ${key === activePredictionMarket ? 'active' : ''}" data-prediction-market="${key}">${market.tabLabel}</button>`).join('');
        const filters = [70, 75, 80, 85, 90].map(threshold => `<button class="prediction-filter ${threshold === predictionThreshold ? 'active' : ''}" data-prediction-threshold="${threshold}">≥ ${threshold}%</button>`).join('');
        const comboButtons = predictionMode === 'history' && config.combos
          ? config.combos.map(combo => `<button class="prediction-filter combo ${combo.key === activePredictionCombo ? 'active' : ''}" data-prediction-combo="${combo.key}">✓ ${combo.label}</button>`).join('')
          : '';
        const modes = `<button class="prediction-filter ${predictionMode === 'upcoming' ? 'active' : ''}" data-prediction-mode="upcoming">Próximos jogos</button><button class="prediction-filter ${predictionMode === 'history' ? 'active' : ''}" data-prediction-mode="history">Histórico</button>`;
        const refreshButton = `<button class="today-refresh-button" id="predictionsRefreshButton">↻ Atualizar</button>`;

        if (predictionMode === 'history') {
          const hits = selected.filter(record => record.hit).length;
          const accuracy = selected.length ? Math.round((hits / selected.length) * 100) : 0;
          const dimensions = [{ key: 'hit', label: config.hitLabel }, ...(config.companions || [])];
          const hasCompanions = dimensions.length > 1;
          const dimensionStats = dimensions.map(dimension => {
            const known = selected.filter(record => record[dimension.key] !== undefined);
            const greens = known.filter(record => record[dimension.key]).length;
            return { label: dimension.label, greens, reds: known.length - greens, total: known.length };
          });
          const outcomeHeader = hasCompanions ? dimensions.map(d => d.label).join(' / ') : 'Resultado';
          const heroCaption = hasCompanions
            ? `${dimensionStats.map(d => `${d.label}: ${d.total ? Math.round((d.greens / d.total) * 100) : 0}% (${d.greens}/${d.total})`).join(' · ')} — ${selected.length} previsões selecionadas.`
            : `${hits} acertos em ${selected.length} previsões selecionadas.`;
          const heroFacts = hasCompanions
            ? dimensionStats.map(d => `<div class="hero-fact"><div class="hero-fact-value">${d.greens}</div><div class="hero-fact-label">Green ${d.label}</div></div>`).join('') + dimensionStats.map(d => `<div class="hero-fact"><div class="hero-fact-value">${d.reds}</div><div class="hero-fact-label">Red ${d.label}</div></div>`).join('')
            : `<div class="hero-fact"><div class="hero-fact-value">${records.length}</div><div class="hero-fact-label">Jogos analisados</div></div><div class="hero-fact"><div class="hero-fact-value">${hits}</div><div class="hero-fact-label">Green</div></div><div class="hero-fact"><div class="hero-fact-value">${selected.length - hits}</div><div class="hero-fact-label">Red</div></div><div class="hero-fact"><div class="hero-fact-value">${records.length ? Math.round((selected.length / records.length) * 100) : 0}%</div><div class="hero-fact-label">Cobertura</div></div>`;
          const outcomeBadge = (label, value) => {
            const state = value === undefined ? 'unknown' : value ? 'win' : 'loss';
            const text = value === undefined ? '—' : value ? 'Green' : 'Red';
            return `<span class="outcome ${state}">${label ? `${label} ${text}` : text}</span>`;
          };
          const rows = selected.sort((a, b) => b.probability - a.probability).map(record => {
            const outcomeCell = hasCompanions
              ? `<div class="outcome-pair">${dimensions.map(d => outcomeBadge(d.label, record[d.key])).join('')}</div>`
              : `<div class="outcome ${record.hit ? 'win' : 'loss'}">${record.hit ? 'Green' : 'Red'}</div>`;
            return `<div class="result-row"><div class="fixture">${record.homeTeam} × ${record.awayTeam}<small>${competitionLabel(record)}</small></div><div class="result-number">${record.probability}% previsto</div><div class="result-number">HT: ${record.halftimeGoals} · FT: ${record.finalGoals}</div><div class="result-number">1º gol: ${record.firstGoalMinute ? `${record.firstGoalMinute}'` : 'Sem timeline'}</div>${outcomeCell}</div>`;
          }).join('');
          content.innerHTML = `<div class="lab-eyebrow">Banco local · ${config.eyebrow} · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">${config.title}</h1><p class="lab-source">Histórico consolidado com a última previsão registrada antes do início da partida. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div>${bestFilterBanner}<div class="prediction-controls">${markets}</div><div class="prediction-controls">${modes}${refreshButton}</div><div class="prediction-controls">${filters}${comboButtons}</div><section class="lab-hero"><div class="hero-copy"><div class="hero-market">${activeCombo ? activeCombo.label : `Corte ≥ ${predictionThreshold}%`}</div><div class="hero-rate">${accuracy}%</div><p class="hero-caption">${heroCaption}</p></div><div class="hero-facts">${heroFacts}</div></section><div class="section-heading"><h2>Resultados históricos</h2><span>Ordenados pela previsão X7</span></div><section class="lab-results"><div class="result-row header"><div>Partida</div><div>Previsão</div><div>Placar</div><div>Ritmo</div><div>${outcomeHeader}</div></div>${rows || '<div class="empty">Nenhum jogo atende a este corte.</div>'}</section>`;
        } else {
          const groups = selected.reduce((grouped, prediction) => {
          const key = prediction.kickoffAt?.slice(0, 10) || 'sem-data';
          (grouped[key] ||= []).push(prediction);
          return grouped;
        }, {});
        const runway = Object.values(groups).map(group => `
          <section><div class="prediction-date">${formatDate(group[0].kickoffAt)}</div>
          ${group.map(prediction => {
            const strong = prediction.probability >= 90;
            return `<article class="prediction-card"><div class="prediction-time">${formatKickoff(prediction.kickoffAt)}</div><div class="prediction-fixture">${prediction.homeTeam} × ${prediction.awayTeam}<small>${competitionLabel(prediction)}</small></div><div><div class="prediction-probability">${prediction.probability}%</div><div class="prediction-detail">${config.badgeLabel}</div></div><div class="prediction-detail">Média gols: ${prediction.combinedGoalsAverage != null ? prediction.combinedGoalsAverage.toFixed(1) : '—'}<br>Over 0.5: ${prediction.over05Percentage ?? '—'}%</div><div class="prediction-signal ${strong ? '' : 'monitor'}">${strong ? 'Sinal forte' : 'Monitorar'}</div></article>`;
          }).join('')}</section>`).join('');
          content.innerHTML = `<div class="lab-eyebrow">Banco local · modelo X7 · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">Próximos jogos<br>${config.title}</h1><p class="lab-source">Sinais ordenados por horário. A odd exibida pelo modelo não é uma cotação real de aposta. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div>${bestFilterBanner}<div class="prediction-controls">${markets}</div><div class="prediction-controls">${modes}${refreshButton}</div><div class="prediction-controls">${filters}</div><div class="section-heading"><h2>${selected.length} oportunidades encontradas</h2><span>Corte atual: ${predictionThreshold}%</span></div><div class="prediction-runway">${runway || '<div class="empty">Nenhum próximo jogo atende a este corte.</div>'}</div><p class="lab-note">“Sinal forte” indica probabilidade do modelo ≥90%. Confirme escalações, mercado e cotação real antes de qualquer decisão.</p>`;
        }
        content.querySelectorAll('[data-prediction-market]').forEach(button => button.addEventListener('click', () => { activePredictionMarket = button.dataset.predictionMarket; activePredictionCombo = null; renderPredictions(); }));
        content.querySelectorAll('[data-prediction-threshold]').forEach(button => button.addEventListener('click', () => { predictionThreshold = Number(button.dataset.predictionThreshold); activePredictionCombo = null; renderPredictions(); }));
        content.querySelectorAll('[data-prediction-mode]').forEach(button => button.addEventListener('click', () => { predictionMode = button.dataset.predictionMode; activePredictionCombo = null; renderPredictions(); }));
        content.querySelectorAll('[data-prediction-combo]').forEach(button => button.addEventListener('click', () => {
          const combo = config.combos.find(c => c.key === button.dataset.predictionCombo);
          const turningOn = activePredictionCombo !== combo.key;
          activePredictionCombo = turningOn ? combo.key : null;
          if (turningOn) predictionThreshold = combo.threshold;
          renderPredictions();
        }));
        const predictionsRefreshButton = document.getElementById('predictionsRefreshButton');
        if (predictionsRefreshButton) predictionsRefreshButton.addEventListener('click', () => { bestFiltersCache = null; renderPredictions(); });
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar as previsões: ${error.message}</div>`;
      }
    }

    // "Qual resultado NÃO sai no intervalo": modelo escolhe, por jogo, o resultado
    // (casa/empate/fora) menos provável ao intervalo — núcleo é Poisson sobre a média de
    // gols do 1º tempo (backtest: 84.5% de acerto com cobertura total; base "sempre excluir
    // Fora" ~73.5%). Odds de mercado (1T/FT) só reforçam via "fontes", nunca substituem a
    // escolha do Poisson. Ver src/analysis/half-time-exclusion.ts.
    let htMode = 'upcoming'; // 'upcoming' | 'history'
    let htMinConfidence = 0; // % de confiança mínima no lado excluído; 0 = cobertura total
    let htFavoritesOnly = true; // pré-selecionado: só países/ligas marcados na aba Favoritos
    let htAgreementFilter = 'all'; // 'all' ou "agreement/sourcesAvailable" exato (ex.: "3/3", "1/2")
    let htConfidenceLocked = false; // true a partir do primeiro clique manual num corte
    let htBestConfidenceCache = null; // Promise<{threshold,accuracy,n}|null> — refeita ao trocar toggle de favoritas ou fontes

    const HT_CONFIDENCE_THRESHOLDS = [0, 72, 76, 80];
    // Combinações reais de agreement/sourcesAvailable que o modelo produz: Poisson conta
    // sempre, +1 se odds 1T disponível, +1 se odds FT disponível — daí 1/1, 1/2, 2/2, 1/3,
    // 2/3, 3/3 (nunca "0/x", já que Poisson sempre concorda com a própria escolha).
    const HT_AGREEMENT_FILTERS = ['all', '3/3', '2/2', '2/3', '1/2', '1/3', '1/1'];
    const HT_BEST_CONFIDENCE_MIN_N = 20;
    const HT_OUTCOME_LABEL = { home: 'Casa', draw: 'Empate', away: 'Fora' };
    const HT_OUTCOME_SHORT = { home: 'C', draw: 'E', away: 'F' };
    const htConfidence = record => Math.round((1 - record.probs[record.excluded]) * 100);
    const htConfidenceLabel = threshold => threshold ? `≥ ${threshold}%` : 'cobertura total (sem corte)';
    const htProbsCell = record => `<div class="ht-probs">${['home', 'draw', 'away'].map(key =>
      `<span class="ht-prob ${key === record.excluded ? 'excluded' : ''}">${HT_OUTCOME_SHORT[key]} ${Math.round(record.probs[key] * 100)}%</span>`
    ).join('')}</div>`;
    const htExcludeBadge = record => `<span class="ht-exclude-badge">Exclui ${HT_OUTCOME_LABEL[record.excluded]}</span>`;
    const htAgreementKey = record => `${record.agreement}/${record.sourcesAvailable}`;
    const htAgreementBadge = record => `<span class="ht-agreement ${record.agreement === record.sourcesAvailable ? 'full' : ''}">${htAgreementKey(record)} fontes</span>`;
    const htAgreementLabel = key => key === 'all' ? 'Todos' : `${key} fontes`;
    const htFavToggle = record => {
      const fav = isFavoriteMatch(record);
      return `<button class="daily-fav-toggle ${fav ? 'active' : ''}" data-ht-toggle-fav="${favoriteLeagueKey(record.country, record.competition)}" title="${fav ? 'Remover liga dos favoritos' : 'Marcar liga como favorita'}">${fav ? '★' : '☆'}</button>`;
    };

    // Varre os mesmos cortes dos botões contra o histórico real e pega o de maior acerto
    // (mín. 20 jogos, mesmo critério do "melhor filtro" da aba Over 0.5/1.5). Sempre lê o
    // histórico (não o endpoint do modo atual), pra funcionar igual em Próximos e Histórico.
    async function computeBestHtConfidence() {
      try {
        const response = await fetch('/api/history/ht-exclusion');
        if (!response.ok) return null;
        const records = await response.json();
        const pool = (htFavoritesOnly ? records.filter(isFavoriteMatch) : records)
          .filter(record => htAgreementFilter === 'all' || htAgreementKey(record) === htAgreementFilter);
        let best = null;
        for (const threshold of HT_CONFIDENCE_THRESHOLDS) {
          const atThreshold = pool.filter(record => htConfidence(record) >= threshold);
          if (atThreshold.length < HT_BEST_CONFIDENCE_MIN_N) continue;
          const hits = atThreshold.filter(record => record.hit).length;
          const accuracy = Math.round((hits / atThreshold.length) * 100);
          if (!best || accuracy > best.accuracy || (accuracy === best.accuracy && atThreshold.length > best.n)) {
            best = { threshold, accuracy, n: atThreshold.length };
          }
        }
        return best;
      } catch {
        return null;
      }
    }

    async function renderHtExclusion() {
      const content = document.getElementById('htExclusionContent');
      content.innerHTML = '<div class="lab-loading">Consultando modelo de 1º tempo…</div>';
      try {
        const endpoint = htMode === 'upcoming' ? '/api/predictions/ht-exclusion' : '/api/history/ht-exclusion';
        if (!htBestConfidenceCache) htBestConfidenceCache = computeBestHtConfidence();
        const [response, bestConfidence] = await Promise.all([fetch(endpoint), htBestConfidenceCache]);
        if (!response.ok) throw new Error('Banco local indisponível');
        if (bestConfidence && !htConfidenceLocked) htMinConfidence = bestConfidence.threshold;
        const records = await response.json();
        const favoritesFiltered = htFavoritesOnly ? records.filter(isFavoriteMatch) : records;
        // Sem o filtro de fontes ainda — é a base usada pelos cards de "acerto por fonte",
        // que precisam ver TODAS as combinações lado a lado, independente da selecionada.
        const confidenceAndFavoritesFiltered = favoritesFiltered.filter(record => htConfidence(record) >= htMinConfidence);
        const selected = confidenceAndFavoritesFiltered.filter(record => htAgreementFilter === 'all' || htAgreementKey(record) === htAgreementFilter);

        const modes = `<button class="prediction-filter ${htMode === 'upcoming' ? 'active' : ''}" data-ht-mode="upcoming">Próximos jogos</button><button class="prediction-filter ${htMode === 'history' ? 'active' : ''}" data-ht-mode="history">Histórico</button>`;
        const confidenceFilters = HT_CONFIDENCE_THRESHOLDS.map(threshold => `<button class="prediction-filter ${threshold === htMinConfidence ? 'active' : ''}" data-ht-confidence="${threshold}">${threshold ? `Confiança ≥ ${threshold}%` : 'Todos'}</button>`).join('');
        const agreementFilters = HT_AGREEMENT_FILTERS.map(key => `<button class="prediction-filter ${key === htAgreementFilter ? 'active' : ''}" data-ht-agreement="${key}">${htAgreementLabel(key)}</button>`).join('');
        const favoritesToggle = `<button class="prediction-filter ${htFavoritesOnly ? 'active' : ''}" id="htFavoritesToggle">★ Só ligas favoritas</button>`;
        const bestConfidenceNote = bestConfidence
          ? `<p class="lab-source">🎯 Melhor confiança: <strong>${htConfidenceLabel(bestConfidence.threshold)}</strong> — ${bestConfidence.accuracy}% de acerto em ${bestConfidence.n} jogos${htConfidenceLocked ? '.' : ' (já selecionada abaixo).'}</p>`
          : `<p class="lab-source">Ainda sem jogos suficientes (mín. ${HT_BEST_CONFIDENCE_MIN_N} por corte) pra recomendar uma confiança.</p>`;
        const intro = `<div class="lab-eyebrow">Banco local · Poisson sobre médias de gols 1º tempo · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">Qual resultado<br>não sai no intervalo.</h1><p class="lab-source">Escolhe, por jogo, o resultado (casa/empate/fora) menos provável ao intervalo. Confirme escalações e cotação real antes de qualquer decisão.</p></div>`;

        if (htMode === 'history') {
          const hits = selected.filter(record => record.hit).length;
          const accuracy = selected.length ? Math.round(100 * hits / selected.length) : 0;
          const clean = selected.filter(record => !record.usedBackfilledFeatures);
          const dirty = selected.filter(record => record.usedBackfilledFeatures);
          const rate = list => list.length ? Math.round(100 * list.filter(record => record.hit).length / list.length) : 0;

          // Independente do toggle "Só ligas favoritas" (senão, com o toggle ligado, "Outras
          // ligas" sempre daria n=0) — respeita só o corte de confiança atual.
          const confidenceOnly = records.filter(record => htConfidence(record) >= htMinConfidence);
          const favoriteRecords = confidenceOnly.filter(isFavoriteMatch);
          const otherRecords = confidenceOnly.filter(record => !isFavoriteMatch(record));

          // Acerto de cada combinação fontes/concordância lado a lado, sempre com a mesma
          // base (favoritas + confiança atuais, SEM o filtro de fontes) — pra comparar as 6
