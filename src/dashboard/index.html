<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SokkerPRO Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e6eb;
      min-height: 100vh;
    }

    .header {
      background: #1a1d24;
      border-bottom: 1px solid #2d3139;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffd21e;
    }

    .header .subtitle {
      font-size: 13px;
      color: #8b8f98;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    select, input {
      background: #252830;
      border: 1px solid #3a3d45;
      color: #e4e6eb;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    select:focus, input:focus {
      border-color: #ffd21e;
    }

    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      background: #15171c;
      border-bottom: 1px solid #2d3139;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #ffd21e;
    }

    .stat-label {
      font-size: 11px;
      color: #8b8f98;
      text-transform: uppercase;
    }

    .container {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .match-grid {
      display: grid;
      gap: 12px;
    }

    .match-card {
      background: #1a1d24;
      border: 1px solid #2d3139;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .match-card:hover {
      border-color: #ffd21e;
      transform: translateY(-1px);
    }

    .match-card.has-goals {
      border-left: 3px solid #22c55e;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .competition {
      font-size: 12px;
      color: #8b8f98;
    }

    .status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-live { background: #dc2626; color: white; }
    .status-finished { background: #22c55e; color: white; }
    .status-not_started { background: #3a3d45; color: #8b8f98; }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .team {
      flex: 1;
      text-align: center;
    }

    .team-name {
      font-size: 14px;
      font-weight: 600;
    }

    .score {
      font-size: 28px;
      font-weight: 700;
      color: #ffd21e;
      min-width: 80px;
      text-align: center;
    }

    .score .separator {
      color: #8b8f98;
      margin: 0 4px;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      color: #8b8f98;
    }

    .goals-list {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2d3139;
    }

    .goal {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
    }

    .goal-minute {
      color: #ffd21e;
      font-weight: 600;
      min-width: 40px;
    }

    .goal-player {
      color: #e4e6eb;
    }

    .goal-team {
      color: #8b8f98;
      font-size: 11px;
    }

    /* Detail Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1a1d24;
      border: 1px solid #2d3139;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-close {
      background: none;
      border: none;
      color: #8b8f98;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #e4e6eb;
    }

    .timeline {
      margin-top: 20px;
    }

    .timeline-item {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #2d3139;
    }

    .timeline-icon {
      font-size: 16px;
      width: 24px;
      text-align: center;
    }

    .timeline-minute {
      color: #ffd21e;
      font-weight: 600;
      min-width: 40px;
    }

    .timeline-content {
      flex: 1;
    }

    .timeline-player {
      font-weight: 600;
    }

    .timeline-desc {
      color: #8b8f98;
      font-size: 12px;
    }

    .odds-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding: 12px;
      background: #252830;
      border-radius: 8px;
    }

    .odd-item {
      text-align: center;
      flex: 1;
    }

    .odd-label {
      font-size: 11px;
      color: #8b8f98;
      margin-bottom: 4px;
    }

    .odd-value {
      font-size: 18px;
      font-weight: 700;
      color: #ffd21e;
    }

    .loading {
      text-align: center;
      padding: 48px;
      color: #8b8f98;
    }

    .empty {
      text-align: center;
      padding: 48px;
      color: #8b8f98;
    }

    :root {
      --pitch: #10251d;
      --canvas: #111714;
      --surface: #18201c;
      --surface-raised: #202a24;
      --line: rgba(214, 230, 215, 0.12);
      --ink: #edf4ed;
      --muted: #91a096;
      --signal: #f5c542;
      --signal-wash: rgba(245, 197, 66, 0.14);
      --win: #5fd28b;
      --loss: #ea6e6e;
    }

    .view-tabs { display: flex; gap: 4px; margin-left: 24px; }
    .view-tab {
      background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .06em; padding: 8px 10px;
      text-transform: uppercase;
    }
    .view-tab:hover, .view-tab:focus-visible { color: var(--ink); outline: none; }
    .view-tab.active { border-bottom-color: var(--signal); color: var(--signal); }
    .lab-active .controls { visibility: hidden; }
    .prediction-active .controls { visibility: hidden; }
    .today-active .controls { visibility: hidden; }
    .favorites-active .controls { visibility: hidden; }
    .pattern-active .controls { visibility: hidden; }
    .app-view { display: none; }
    .app-view.active { display: block; }
    .goals-lab { background: var(--canvas); color: var(--ink); min-height: calc(100vh - 75px); }
    .lab-shell { max-width: 1240px; margin: 0 auto; padding: 44px 24px 72px; }
    .lab-eyebrow { color: var(--signal); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .lab-title-row { align-items: end; display: flex; gap: 24px; justify-content: space-between; margin: 9px 0 30px; }
    .lab-title { font-size: clamp(28px, 4vw, 48px); letter-spacing: -.045em; line-height: .95; max-width: 620px; }
    .lab-source { color: var(--muted); font-size: 12px; max-width: 250px; text-align: right; }
    .lab-hero { background: var(--pitch); border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr); margin-bottom: 22px; overflow: hidden; }
    .hero-copy { padding: 30px; }
    .hero-market { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .hero-rate { color: var(--signal); font-size: clamp(56px, 10vw, 94px); font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.08em; line-height: .9; margin: 13px 0; }
    .hero-caption { color: var(--muted); font-size: 14px; }
    .hero-facts { border-left: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; }
    .hero-fact { border-bottom: 1px solid var(--line); padding: 24px; }
    .hero-fact:nth-child(odd) { border-right: 1px solid var(--line); }
    .hero-fact-value { color: var(--ink); font-size: 27px; font-variant-numeric: tabular-nums; font-weight: 750; }
    .hero-fact-label { color: var(--muted); font-size: 11px; margin-top: 5px; text-transform: uppercase; }
    .market-strip { display: grid; gap: 8px; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 22px; }
    .market-button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); cursor: pointer; min-height: 95px; padding: 14px; text-align: left; }
    .market-button:hover, .market-button:focus-visible { border-color: rgba(245, 197, 66, .65); outline: none; }
    .market-button.active { background: var(--signal-wash); border-color: var(--signal); }
    .market-name { color: var(--muted); display: block; font-size: 11px; line-height: 1.3; text-transform: uppercase; }
    .market-score { display: block; font-size: 23px; font-variant-numeric: tabular-nums; font-weight: 750; margin-top: 9px; }
    .section-heading { align-items: baseline; display: flex; justify-content: space-between; margin: 32px 0 12px; }
    .section-heading h2 { font-size: 16px; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .threshold-rail { background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
    .threshold { background: none; border: 0; border-right: 1px solid var(--line); color: var(--ink); cursor: pointer; min-height: 145px; padding: 17px; position: relative; text-align: left; }
    .threshold:last-child { border-right: 0; }
    .threshold:hover, .threshold:focus-visible { background: var(--surface-raised); outline: none; }
    .threshold.active { background: var(--signal-wash); }
    .threshold.active::before { background: var(--signal); content: ''; height: 3px; left: 0; position: absolute; right: 0; top: 0; }
    .threshold-cut { color: var(--muted); font-size: 12px; }
    .threshold-rate { display: block; font-size: 30px; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.05em; margin: 18px 0 4px; }
    .threshold-meta { color: var(--muted); font-size: 11px; }
    .lab-results { background: var(--surface); border: 1px solid var(--line); overflow: auto; }
    .result-row { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 12px; grid-template-columns: minmax(220px, 1.6fr) .7fr .55fr .7fr .8fr; min-width: 720px; padding: 13px 18px; }
    .result-row:last-child { border-bottom: 0; }
    .result-row.header { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .fixture { font-size: 13px; font-weight: 650; }
    .fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 3px; }
    .result-number { font-size: 13px; font-variant-numeric: tabular-nums; }
    .outcome { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .outcome.win { color: var(--win); }
    .outcome.loss { color: var(--loss); }
    .outcome.unknown { color: var(--muted); }
    .outcome-pair { display: flex; flex-direction: column; gap: 4px; }
    .lab-note { border-left: 2px solid var(--signal); color: var(--muted); font-size: 12px; line-height: 1.55; margin-top: 22px; padding: 12px 15px; }
    .lab-loading { color: var(--muted); padding: 70px 0; text-align: center; }
    .prediction-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .prediction-filter { background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: pointer; font-size: 12px; font-weight: 700; padding: 8px 12px; }
    .prediction-filter.active, .prediction-filter:hover, .prediction-filter:focus-visible { border-color: var(--signal); color: var(--signal); outline: none; }
    .prediction-runway { border: 1px solid var(--line); }
    .prediction-date { background: var(--pitch); border-bottom: 1px solid var(--line); color: var(--signal); font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 11px 16px; text-transform: uppercase; }
    .prediction-card { align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; gap: 18px; grid-template-columns: 78px minmax(200px, 1fr) 110px 105px 130px; padding: 17px; }
    .prediction-card:last-child { border-bottom: 0; }
    .prediction-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .prediction-fixture { font-size: 14px; font-weight: 700; }
    .prediction-fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 4px; }
    .prediction-probability { color: var(--signal); font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.05em; }
    .prediction-detail { color: var(--muted); font-size: 11px; line-height: 1.5; }
    .prediction-signal { border: 1px solid rgba(95, 210, 139, .4); color: var(--win); font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 7px 8px; text-align: center; text-transform: uppercase; }
    .prediction-signal.monitor { border-color: rgba(245, 197, 66, .45); color: var(--signal); }
    @media (max-width: 800px) { .prediction-card { grid-template-columns: 62px 1fr 80px; } .prediction-detail, .prediction-signal { display: none; } }
    .today-table { border: 1px solid var(--line); overflow-x: auto; }
    .today-row { align-items: center; border-bottom: 1px solid var(--line); display: grid; gap: 10px; grid-template-columns: 64px minmax(200px, 1fr) 84px repeat(5, 78px) 150px; min-width: 1020px; padding: 12px 16px; }
    .today-row:last-child { border-bottom: 0; }
    .today-row.header { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .today-row.is-live { background: rgba(234, 110, 110, .06); border-left: 2px solid var(--loss); }
    .today-time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .today-fixture { font-size: 13px; font-weight: 650; }
    .today-fixture small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; margin-top: 3px; }
    .today-score { font-size: 14px; font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
    .today-score.muted { color: var(--line); font-weight: 400; }
    .today-score small { color: var(--muted); display: block; font-size: 10px; font-weight: 700; margin-top: 2px; text-transform: uppercase; }
    .today-score.live { color: var(--loss); }
    .today-score.live small { color: var(--loss); }
    .today-chip { border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 4px; text-align: center; }
    .today-chip.strong { background: var(--signal-wash); border-color: var(--signal); color: var(--signal); }
    .today-chip.empty { color: var(--line); }
    .today-signal-cell { font-size: 11px; text-align: center; }
    .today-signal { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); display: inline-block; font-weight: 800; padding: 5px 7px; }
    .today-signal.strong { background: rgba(95, 210, 139, .12); border-color: var(--win); color: var(--win); }
    .today-signal-empty { color: var(--line); }
    .today-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
    .today-goal-controls { align-items: center; margin-top: -12px; }
    .today-controls-label { color: var(--muted); font-size: 12px; font-weight: 700; margin-right: 4px; }
    .today-market-strip { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .today-refresh { align-items: flex-end; display: flex; flex-direction: column; gap: 6px; }
    .today-refresh-button { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .04em; padding: 10px 16px; text-transform: uppercase; }
    .today-refresh-button:hover:not(:disabled) { background: var(--signal); color: var(--pitch); }
    .today-refresh-button:disabled { cursor: wait; opacity: .6; }
    .today-refresh-meta { color: var(--muted); font-size: 11px; }
    .today-refresh-error { color: var(--loss); font-size: 11px; max-width: 260px; text-align: right; }
    .favorite-star { color: var(--signal); margin-right: 5px; }
    .favorites-search { background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 13px; margin: 20px 0; padding: 10px 14px; width: 100%; }
    .favorites-search:focus { border-color: var(--signal); outline: none; }
    .favorites-list { border: 1px solid var(--line); }
    .favorite-country-block { border-bottom: 1px solid var(--line); }
    .favorite-country-block:last-child { border-bottom: 0; }
    .favorite-country-header { align-items: center; display: flex; justify-content: space-between; padding: 12px 16px; }
    .favorite-country-header label { align-items: center; cursor: pointer; display: flex; font-size: 14px; gap: 8px; }
    .favorite-expand { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; }
    .favorite-expand:hover { color: var(--signal); }
    .favorite-leagues { background: var(--surface); display: grid; gap: 2px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); padding: 4px 16px 14px 40px; }
    .favorite-league-row { align-items: center; color: var(--muted); cursor: pointer; display: flex; font-size: 13px; gap: 8px; padding: 4px 0; }
    .favorite-league-row:hover { color: var(--ink); }
    .favorite-top-flight { background: var(--signal-wash); border: 1px solid var(--signal); color: var(--signal); font-size: 9px; font-weight: 800; letter-spacing: .05em; padding: 1px 5px; text-transform: uppercase; }
    #favoritesMarkTopFlight { margin: 4px 0 0; }
    #favoritesMarkTopFlight:disabled { cursor: default; opacity: .4; }
    @media (max-width: 900px) { .today-market-strip { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px) {
      .header { align-items: flex-start; flex-wrap: wrap; gap: 14px; }
      .view-tabs { margin-left: 0; order: 3; width: 100%; }
      .controls { flex-wrap: wrap; }
      .lab-title-row, .lab-hero { display: block; }
      .lab-source { margin-top: 15px; text-align: left; }
      .hero-facts { border-left: 0; border-top: 1px solid var(--line); }
      .market-strip { grid-template-columns: repeat(2, 1fr); }
      .threshold-rail { grid-template-columns: 1fr; }
      .threshold { border-bottom: 1px solid var(--line); border-right: 0; min-height: 92px; }
    }
  </style>
</head>
<body>
    <div class="header">
      <div>
        <h1>SokkerPRO</h1>
        <div class="subtitle">Dashboard de Jogos</div>
      </div>
      <div class="view-tabs" aria-label="Visões do dashboard">
        <button class="view-tab active" data-view="matchesView">Jogos</button>
        <button class="view-tab" data-view="todayView">Hoje</button>
        <button class="view-tab" data-view="labView">Laboratório de gols</button>
        <button class="view-tab" data-view="predictionsView">Previsões</button>
        <button class="view-tab" data-view="patternView">0x0 aos 30'</button>
        <button class="view-tab" data-view="favoritesView">Favoritos</button>
      </div>
    <div class="controls">
      <select id="fileSelect">
        <option value="">Carregando...</option>
      </select>
      <input type="text" id="searchInput" placeholder="Buscar time...">
      <select id="statusFilter">
        <option value="">Todos</option>
        <option value="not_started">Aguardando</option>
        <option value="live">Ao Vivo</option>
        <option value="finished">Finalizado</option>
      </select>
    </div>
  </div>

  <div class="app-view active" id="matchesView">
  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <div class="stat-value" id="totalMatches">-</div>
      <div class="stat-label">Jogos</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalGoals">-</div>
      <div class="stat-label">Gols</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="avgGoals">-</div>
      <div class="stat-label">Média Gols</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalLeagues">-</div>
      <div class="stat-label">Ligas</div>
    </div>
  </div>

  <div class="container">
    <div class="match-grid" id="matchGrid">
      <div class="loading">Carregando dados...</div>
    </div>
  </div>
  </div>

  <main class="app-view goals-lab" id="todayView">
    <div class="lab-shell" id="todayContent">
      <div class="lab-loading">Carregando jogos de hoje…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="labView">
    <div class="lab-shell" id="labContent">
      <div class="lab-loading">Carregue os arquivos de partidas para analisar as estratégias.</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="predictionsView">
    <div class="lab-shell" id="predictionsContent">
      <div class="lab-loading">Carregando previsões…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="patternView">
    <div class="lab-shell" id="patternContent">
      <div class="lab-loading">Carregando padrão 0x0 aos 30'…</div>
    </div>
  </main>

  <main class="app-view goals-lab" id="favoritesView">
    <div class="lab-shell" id="favoritesContent">
      <div class="lab-loading">Carregando países e ligas…</div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let allMatches = [];
    let currentData = null;
    let availableFiles = [];
    let strategyData = [];
    let activeMarket = 'gols_1t_05_over';
    let activeThreshold = 80;
    let predictionThreshold = 80;
    let predictionMode = 'upcoming';
    let activePredictionMarket = 'over_05_ht';

    const PREDICTION_MARKETS = {
      over_05_ht: {
        tabLabel: 'O0.5 HT',
        badgeLabel: 'O0.5 HT',
        title: 'Over 0.5<br>1º tempo.',
        upcomingEndpoint: '/api/predictions/over-05-ht',
        historyEndpoint: '/api/history/over-05-ht',
        eyebrow: 'previsão pré-jogo × placar HT',
        hitLabel: 'HT',
        companions: [
          { key: 'ftHit', label: 'FT' },
          { key: 'by75Hit', label: "75'" },
        ],
      },
      over_05_ft: {
        tabLabel: 'O0.5 FT',
        badgeLabel: 'O0.5 FT',
        title: 'Over 0.5<br>final.',
        upcomingEndpoint: '/api/predictions/over-05-ft',
        historyEndpoint: '/api/history/over-05-ft',
        eyebrow: 'previsão pré-jogo × placar final',
        hitLabel: 'FT',
        companions: [
          { key: 'htHit', label: 'HT' },
          { key: 'by75Hit', label: "75'" },
        ],
      },
      over_15_ft: {
        tabLabel: 'O1.5 FT',
        badgeLabel: 'O1.5 FT',
        title: 'Over 1.5<br>final.',
        upcomingEndpoint: '/api/predictions/over-15-ft',
        historyEndpoint: '/api/history/over-15-ft',
        eyebrow: 'previsão pré-jogo × placar final',
        hitLabel: '',
        companions: [],
      },
    };

    const GOALS_MARKETS = {
      gols_1t_05_over: { label: 'Over 0.5 · 1º tempo', hit: match => halftimeGoals(match) >= 1 },
      gols_1t_15_over: { label: 'Over 1.5 · 1º tempo', hit: match => halftimeGoals(match) >= 2 },
      over_15_ft_over: { label: 'Over 1.5 · final', hit: match => finalGoals(match) >= 2 },
      over_25_ft_over: { label: 'Over 2.5 · final', hit: match => finalGoals(match) >= 3 },
      btts_sim: { label: 'Ambas marcam', hit: match => (match.score?.home ?? 0) >= 1 && (match.score?.away ?? 0) >= 1 },
    };
    const THRESHOLDS = [60, 65, 70, 75, 80];

    const FAVORITES_STORAGE_KEY = 'sokkerpro:favorites';
    function loadFavorites() {
      try {
        const parsed = JSON.parse(localStorage.getItem(FAVORITES_STORAGE_KEY) || '{}');
        return { countries: parsed.countries || [], leagues: parsed.leagues || [] };
      } catch {
        return { countries: [], leagues: [] };
      }
    }
    function saveFavorites() {
      localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favorites));
    }
    let favorites = loadFavorites();
    let knownLeagues = [];
    let favoritesSearchTerm = '';
    const expandedFavoriteCountries = new Set();
    const isFavoriteMatch = match => favorites.countries.includes(match.country) || favorites.leagues.includes(match.competition);

    async function renderFavorites() {
      const content = document.getElementById('favoritesContent');
      if (!knownLeagues.length) content.innerHTML = '<div class="lab-loading">Carregando países e ligas…</div>';
      try {
        // Refetches every time this tab opens (not just once) so leagues/countries
        // that get scraped for the first time later (e.g. a league starting its
        // season) show up here without needing a full page reload.
        const response = await fetch('/api/leagues');
        if (!response.ok) throw new Error('Banco local indisponível');
        knownLeagues = await response.json();
      } catch (error) {
        if (!knownLeagues.length) {
          content.innerHTML = `<div class="empty">Não foi possível carregar países e ligas: ${error.message}</div>`;
          return;
        }
      }
      renderFavoritesUI();
    }

    function renderFavoritesUI() {
      const content = document.getElementById('favoritesContent');
      const term = favoritesSearchTerm.trim().toLowerCase();
      const byCountry = new Map();
      knownLeagues.forEach(({ country, competition, isTopFlight }) => {
        (byCountry.get(country) ?? byCountry.set(country, []).get(country)).push({ competition, isTopFlight });
      });
      const groups = [...byCountry.entries()]
        .map(([country, leagues]) => ({ country, leagues }))
        .filter(group => !term || group.country.toLowerCase().includes(term) || group.leagues.some(l => l.competition.toLowerCase().includes(term)))
        .sort((a, b) => a.country.localeCompare(b.country));

      const topFlightAvailable = groups.filter(g => g.leagues.some(l => l.isTopFlight));
      const topFlightMissing = topFlightAvailable.filter(g => !g.leagues.some(l => l.isTopFlight && favorites.leagues.includes(l.competition))).length;

      const rows = groups.map(group => {
        const expanded = expandedFavoriteCountries.has(group.country);
        const countryChecked = favorites.countries.includes(group.country);
        const sortedLeagues = [...group.leagues].sort((a, b) => (a.isTopFlight === b.isTopFlight ? a.competition.localeCompare(b.competition) : a.isTopFlight ? -1 : 1));
        const leagueRows = sortedLeagues.map(({ competition, isTopFlight }) => `
          <label class="favorite-league-row"><input type="checkbox" data-fav-league="${competition}" ${favorites.leagues.includes(competition) ? 'checked' : ''}> ${competition}${isTopFlight ? ' <span class="favorite-top-flight">principal</span>' : ''}</label>
        `).join('');
        return `
          <div class="favorite-country-block">
            <div class="favorite-country-header">
              <label><input type="checkbox" data-fav-country="${group.country}" ${countryChecked ? 'checked' : ''}> <strong>${group.country}</strong></label>
              <button class="favorite-expand" data-toggle-country="${group.country}">${expanded ? '▾' : '▸'} ${group.leagues.length} liga${group.leagues.length === 1 ? '' : 's'}</button>
            </div>
            ${expanded ? `<div class="favorite-leagues">${leagueRows}</div>` : ''}
          </div>`;
      }).join('');

      content.innerHTML = `
        <div class="lab-eyebrow">Configuração · salvo neste navegador</div>
        <div class="lab-title-row"><h1 class="lab-title">Países e ligas<br>favoritas.</h1><p class="lab-source">${favorites.countries.length} país(es) e ${favorites.leagues.length} liga(s) marcadas. Usado pra destacar (★) e filtrar jogos na aba Hoje.</p></div>
        <button class="today-refresh-button" id="favoritesMarkTopFlight" ${topFlightMissing === 0 ? 'disabled' : ''}>★ Marcar ${topFlightMissing || ''} liga${topFlightMissing === 1 ? '' : 's'} principais conhecidas</button>
        <input type="text" class="favorites-search" id="favoritesSearch" placeholder="Buscar país ou liga…" value="${favoritesSearchTerm}">
        <div class="favorites-list">${rows || '<div class="empty">Nenhum país/liga encontrado.</div>'}</div>`;

      const searchInput = document.getElementById('favoritesSearch');
      searchInput.addEventListener('input', () => { favoritesSearchTerm = searchInput.value; renderFavoritesUI(); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); });
      content.querySelectorAll('[data-fav-country]').forEach(box => box.addEventListener('change', () => {
        const country = box.dataset.favCountry;
        favorites.countries = box.checked ? [...favorites.countries, country] : favorites.countries.filter(c => c !== country);
        saveFavorites();
        renderFavoritesUI();
      }));
      content.querySelectorAll('[data-fav-league]').forEach(box => box.addEventListener('change', () => {
        const league = box.dataset.favLeague;
        favorites.leagues = box.checked ? [...favorites.leagues, league] : favorites.leagues.filter(l => l !== league);
        saveFavorites();
        renderFavoritesUI();
      }));
      content.querySelectorAll('[data-toggle-country]').forEach(button => button.addEventListener('click', () => {
        const country = button.dataset.toggleCountry;
        if (expandedFavoriteCountries.has(country)) expandedFavoriteCountries.delete(country);
        else expandedFavoriteCountries.add(country);
        renderFavoritesUI();
      }));
      const markTopFlightButton = document.getElementById('favoritesMarkTopFlight');
      if (markTopFlightButton) markTopFlightButton.addEventListener('click', () => {
        const toAdd = topFlightAvailable
          .flatMap(g => g.leagues.filter(l => l.isTopFlight).map(l => l.competition))
          .filter(league => !favorites.leagues.includes(league));
        favorites.leagues = [...favorites.leagues, ...toAdd];
        saveFavorites();
        renderFavoritesUI();
      });
    }

    const TODAY_MARKETS = [
      { key: 'gols_1t_05_over', label: 'O0.5 1T' },
      { key: 'gols_1t_15_over', label: 'O1.5 1T' },
      { key: 'over_15_ft_over', label: 'O1.5 FT' },
      { key: 'over_25_ft_over', label: 'O2.5 FT' },
      { key: 'btts_sim', label: 'BTTS' },
    ];
    let todayMinProbability = 0;
    let todayFocusMarket = 'gols_1t_05_over';
    let todayGoalFilter = 'all';
    let todayFavoritesOnly = false;
    let todayMatches = [];

    const GOAL_FILTERS = [
      { key: 'all', label: 'Todos' },
      { key: '0', label: '0 gols' },
      { key: '0.5', label: '≥ 0.5' },
      { key: '1.5', label: '≥ 1.5' },
      { key: '2.5', label: '≥ 2.5' },
    ];
    const matchesGoalFilter = match => {
      if (todayGoalFilter === 'all') return true;
      if (match.homeScore === undefined || match.homeScore === null) return false;
      const total = match.homeScore + (match.awayScore ?? 0);
      return todayGoalFilter === '0' ? total === 0 : total >= Math.ceil(Number(todayGoalFilter));
    };
    let todayRefreshing = false;
    let todayLastUpdated = null;
    let todayRefreshError = null;

    const OPEN_STATUSES = new Set(['1st', '2nd', 'et', 'half_time', 'live']);
    const isOpenStatus = status => OPEN_STATUSES.has(status);

    // Sinais validados para "0x0 aos 30' -> sai gol até 75'", do mais para o menos assertivo.
    const ZERO_AT_30_LIVE_CHECKS = [
      { label: "BTTS%times ≥70", test: s => (s.bttsPercentage ?? 0) >= 70, tier: 'strong' },
      { label: 'Score 4/4', test: s => (s.signalScore ?? 0) >= 4, tier: 'strong' },
      { label: 'Combo 91%', test: s => s.over25FtProbability >= 60 && s.combinedGoalsAverage >= 3.4 && s.bttsPercentage >= 60, tier: 'strong' },
      { label: 'Score ≥3', test: s => (s.signalScore ?? 0) >= 3, tier: '' },
      { label: 'Combo 89%', test: s => s.over25FtProbability >= 60 && s.bttsProbability >= 55 && s.bttsPercentage >= 55, tier: '' },
    ];
    const parseLiveMinute = liveMinute => {
      const match = /^(\d+)/.exec(liveMinute || '');
      return match ? Number(match[1]) : undefined;
    };
    const isZeroAt30Live = match => {
      // 'et'/extra_time: janela dos 75' já fechou (0x0 até lá já foi red) — fora.
      if (!isOpenStatus(match.status) || match.status === 'et') return false;
      if (match.homeScore !== 0 || match.awayScore !== 0) return false;
      if (match.status === 'half_time') return true;
      const minute = parseLiveMinute(match.liveMinute);
      return minute !== undefined && minute >= 30 && minute <= 75;
    };
    const zeroAt30Badge = match => {
      if (!isZeroAt30Live(match)) return '<span class="today-signal-empty">—</span>';
      const signals = {
        over25FtProbability: match.predictions['over_25_ft_over']?.probability ?? 0,
        bttsProbability: match.predictions['btts_sim']?.probability ?? 0,
        bttsPercentage: match.bttsPercentage,
        combinedGoalsAverage: match.combinedGoalsAverage,
        signalScore: match.signalScore,
      };
      const hit = ZERO_AT_30_LIVE_CHECKS.find(check => check.test(signals));
      return hit
        ? `<span class="today-signal ${hit.tier}">0x0/30' · ${hit.label}</span>`
        : `<span class="today-signal-empty">0x0/30' · sem sinal</span>`;
    };

    const scoreCell = match => {
      if (match.homeScore === undefined || match.homeScore === null) return '<div class="today-score muted">—</div>';
      const placar = `${match.homeScore}–${match.awayScore ?? 0}`;
      if (isOpenStatus(match.status)) return `<div class="today-score live">${placar}<small>${match.liveMinute ? `${match.liveMinute}'` : 'ao vivo'}</small></div>`;
      if (match.status === 'finished') return `<div class="today-score">${placar}<small>fim</small></div>`;
      return `<div class="today-score">${placar}</div>`;
    };

    async function refreshToday() {
      todayRefreshing = true;
      todayRefreshError = null;
      renderTodayUI();
      try {
        const response = await fetch('/api/today/refresh', { method: 'POST' });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Falha ao atualizar');
        todayMatches = payload.matches;
        todayLastUpdated = payload.updatedAt;
      } catch (error) {
        todayRefreshError = error.message;
      }
      todayRefreshing = false;
      renderTodayUI();
    }

    async function renderToday() {
      const content = document.getElementById('todayContent');
      content.innerHTML = '<div class="lab-loading">Carregando jogos de hoje…</div>';
      try {
        const response = await fetch('/api/today');
        if (!response.ok) throw new Error('Banco local indisponível');
        todayMatches = await response.json();
        renderTodayUI();
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar os jogos de hoje: ${error.message}</div>`;
      }
    }

    function renderTodayUI() {
      const content = document.getElementById('todayContent');
      const filters = [0, 60, 70, 75, 80].map(threshold => `<button class="prediction-filter ${threshold === todayMinProbability ? 'active' : ''}" data-today-threshold="${threshold}">${threshold ? `≥ ${threshold}%` : 'Todos'}</button>`).join('');

      const marketButtons = [{ key: 'all', label: 'Todos os mercados' }, ...TODAY_MARKETS].map(market => {
        const count = market.key === 'all'
          ? todayMatches.filter(match => TODAY_MARKETS.some(m => (match.predictions[m.key]?.probability ?? 0) >= 80)).length
          : todayMatches.filter(match => (match.predictions[market.key]?.probability ?? 0) >= 80).length;
        return `<button class="market-button ${market.key === todayFocusMarket ? 'active' : ''}" data-today-market="${market.key}"><span class="market-name">${market.label}</span><span class="market-score">${count}</span></button>`;
      }).join('');

      const matchesInThreshold = todayMatches.filter(match => {
        const probabilityOk = !todayMinProbability || (todayFocusMarket === 'all'
          ? TODAY_MARKETS.some(market => (match.predictions[market.key]?.probability ?? 0) >= todayMinProbability)
          : (match.predictions[todayFocusMarket]?.probability ?? 0) >= todayMinProbability);
        return probabilityOk && matchesGoalFilter(match) && (!todayFavoritesOnly || isFavoriteMatch(match));
      });

      const goalFilters = GOAL_FILTERS.map(filter => `<button class="prediction-filter ${filter.key === todayGoalFilter ? 'active' : ''}" data-today-goal-filter="${filter.key}">${filter.label}</button>`).join('');
      const favoritesToggle = `<button class="prediction-filter ${todayFavoritesOnly ? 'active' : ''}" id="todayFavoritesToggle">★ Só favoritos</button>`;

      const openCount = todayMatches.filter(match => isOpenStatus(match.status)).length;
      const header = `<div class="today-row header"><div>Horário</div><div>Partida</div><div>Placar</div>${TODAY_MARKETS.map(m => `<div>${m.label}</div>`).join('')}<div>Sinal 0x0/30'</div></div>`;
      const rowHtml = match => {
        const time = match.kickoffAt ? formatKickoff(match.kickoffAt) : '—';
        const chips = TODAY_MARKETS.map(market => {
          const prediction = match.predictions[market.key];
          const probability = prediction?.probability;
          if (probability === undefined) return '<div class="today-chip empty">—</div>';
          return `<div class="today-chip ${probability >= 80 ? 'strong' : ''}">${probability}%</div>`;
        }).join('');
        const star = isFavoriteMatch(match) ? '<span class="favorite-star">★</span>' : '';
        return `<div class="today-row ${isOpenStatus(match.status) ? 'is-live' : ''}"><div class="today-time">${time}</div><div class="today-fixture">${star}${match.homeTeam} × ${match.awayTeam}<small>${competitionLabel(match)}</small></div>${scoreCell(match)}${chips}<div class="today-signal-cell">${zeroAt30Badge(match)}</div></div>`;
      };

      const matchBucket = match => {
        if (isOpenStatus(match.status)) return 'andamento';
        if (match.status === 'not_started') return 'proximos';
        return 'finalizados';
      };
      const buckets = { andamento: [], finalizados: [], proximos: [] };
      matchesInThreshold.forEach(match => buckets[matchBucket(match)].push(match));

      const block = (title, list) => `
        <div class="section-heading"><h2>${title}</h2><span>${list.length} jogo${list.length === 1 ? '' : 's'}</span></div>
        <section class="today-table">${header}${list.map(rowHtml).join('') || '<div class="empty">Nenhum jogo nesse bloco.</div>'}</section>`;

      const focusLabel = todayFocusMarket === 'all' ? 'qualquer mercado' : TODAY_MARKETS.find(m => m.key === todayFocusMarket).label;
      const updatedLabel = todayLastUpdated ? `Atualizado às ${formatKickoff(todayLastUpdated)}` : 'Ainda não atualizado ao vivo';
      const refreshError = todayRefreshError ? `<div class="today-refresh-error">${todayRefreshError}</div>` : '';
      content.innerHTML = `
        <div class="lab-eyebrow">Hoje · ordenado por horário · somente ligas principais</div>
        <div class="lab-title-row">
          <h1 class="lab-title">Jogos de<br>hoje.</h1>
          <div class="today-refresh">
            <button class="today-refresh-button" id="todayRefreshButton" ${todayRefreshing ? 'disabled' : ''}>${todayRefreshing ? 'Atualizando…' : `Atualizar (${openCount} em aberto)`}</button>
            <span class="today-refresh-meta">${updatedLabel}</span>
            ${refreshError}
          </div>
        </div>
        <p class="lab-source">${matchesInThreshold.length} de ${todayMatches.length} jogos hoje batem o corte em ${focusLabel}. Chip destacado = previsão do modelo ≥ 80%.</p>
        <div class="market-strip today-market-strip">${marketButtons}</div>
        <div class="today-controls">${filters}</div>
        <div class="today-controls today-goal-controls"><span class="today-controls-label">Gols no jogo:</span>${goalFilters}${favoritesToggle}</div>
        ${block('Em andamento', buckets.andamento)}
        ${block('Finalizados', buckets.finalizados)}
        ${block('Próximos', buckets.proximos)}
        <p class="lab-note">Horário em Brasília. A odd exibida pelo modelo não é uma cotação real de aposta. "Atualizar" busca placar e minuto ao vivo direto da SokkerPRO.</p>`;
      content.querySelectorAll('[data-today-market]').forEach(button => button.addEventListener('click', () => { todayFocusMarket = button.dataset.todayMarket; renderTodayUI(); }));
      content.querySelectorAll('[data-today-threshold]').forEach(button => button.addEventListener('click', () => { todayMinProbability = Number(button.dataset.todayThreshold); renderTodayUI(); }));
      content.querySelectorAll('[data-today-goal-filter]').forEach(button => button.addEventListener('click', () => { todayGoalFilter = button.dataset.todayGoalFilter; renderTodayUI(); }));
      const refreshButton = document.getElementById('todayRefreshButton');
      if (refreshButton) refreshButton.addEventListener('click', refreshToday);
      const favoritesToggleButton = document.getElementById('todayFavoritesToggle');
      if (favoritesToggleButton) favoritesToggleButton.addEventListener('click', () => { todayFavoritesOnly = !todayFavoritesOnly; renderTodayUI(); });
    }

    // Load available files
    async function loadFiles() {
      const res = await fetch('/api/files');
      const files = await res.json();
      availableFiles = files;
      const select = document.getElementById('fileSelect');
      select.innerHTML = files.length 
        ? files.map(f => `<option value="${f}">${f}</option>`).join('')
        : '<option value="">Nenhum arquivo encontrado</option>';
      
      if (files.length > 0) {
        await loadData(files[files.length - 1]);
      }
    }

    // Load data from file
    async function loadData(file) {
      const res = await fetch(`/api/data?file=${file}`);
      currentData = await res.json();
      allMatches = currentData.matches || [];
      updateStats();
      renderMatches();
      if (document.getElementById('labView').classList.contains('active')) renderGoalsLab();
    }

    const halftimeGoals = match => (match.score?.halftimeHome ?? 0) + (match.score?.halftimeAway ?? 0);
    const finalGoals = match => (match.score?.home ?? 0) + (match.score?.away ?? 0);
    const percent = (value, total) => total ? `${Math.round((value / total) * 100)}%` : '—';
    const dateKey = file => file.match(/sokkerpro-(\d{4}-\d{2}-\d{2})-/)?.[1];

    async function loadGoalsLabData() {
      const response = await fetch('/api/history/snapshots');
      if (!response.ok) throw new Error('Banco local indisponível');
      const snapshots = [{ matches: await response.json() }];
      const predictionsById = new Map();
      const settledById = new Map();
      snapshots.filter(Boolean).forEach(snapshot => snapshot.matches?.forEach(match => {
        const predictionTime = new Date(match.collectedAt).getTime();
        const kickoffTime = new Date(match.kickoffAt).getTime();
        if (match.providerMatchId && Number.isFinite(predictionTime) && Number.isFinite(kickoffTime) && predictionTime < kickoffTime) {
          const knownPrediction = predictionsById.get(match.providerMatchId);
          if (!knownPrediction || new Date(knownPrediction.collectedAt) < new Date(match.collectedAt)) predictionsById.set(match.providerMatchId, match);
        }
        if (match.providerMatchId && match.status === 'finished') {
          const knownResult = settledById.get(match.providerMatchId);
          if (!knownResult || new Date(knownResult.collectedAt) < new Date(match.collectedAt)) settledById.set(match.providerMatchId, match);
        }
      }));
      strategyData = [...settledById.values()]
        .map(settled => {
          const predicted = predictionsById.get(settled.providerMatchId);
          return predicted ? { settled, predicted } : null;
        })
        .filter(Boolean);
    }

    function getStrategyRecords(market = activeMarket) {
      return strategyData.map(({ settled, predicted }) => {
        const prediction = predicted.statistics?.additional?.x7Predictions?.[market]?.pred;
        if (typeof prediction !== 'number') return null;
        return { settled, prediction, hit: GOALS_MARKETS[market].hit(settled) };
      }).filter(Boolean);
    }

    function getMetrics(records, threshold) {
      const selected = records.filter(record => record.prediction >= threshold);
      const hits = selected.filter(record => record.hit).length;
      return { selected, hits, accuracy: percent(hits, selected.length), coverage: percent(selected.length, records.length) };
    }

    async function renderGoalsLab() {
      const content = document.getElementById('labContent');
      content.innerHTML = '<div class="lab-loading">Cruzando previsões pré-jogo com resultados finalizados…</div>';
      try {
        await loadGoalsLabData();
        const records = getStrategyRecords();
        const metrics = getMetrics(records, activeThreshold);
        const marketButtons = Object.entries(GOALS_MARKETS).map(([key, market]) => {
          const marketMetrics = getMetrics(getStrategyRecords(key), activeThreshold);
          return `<button class="market-button ${key === activeMarket ? 'active' : ''}" data-market="${key}"><span class="market-name">${market.label}</span><span class="market-score">${marketMetrics.accuracy}</span></button>`;
        }).join('');
        const thresholds = THRESHOLDS.map(threshold => {
          const item = getMetrics(records, threshold);
          return `<button class="threshold ${threshold === activeThreshold ? 'active' : ''}" data-threshold="${threshold}"><span class="threshold-cut">Probabilidade ≥ ${threshold}%</span><strong class="threshold-rate">${item.accuracy}</strong><span class="threshold-meta">${item.hits}/${item.selected.length} acertos · ${item.coverage} cobertura</span></button>`;
        }).join('');
        const selected = metrics.selected.sort((a, b) => b.prediction - a.prediction);
        const rows = selected.length ? selected.map(({ settled, prediction, hit }) => {
          const firstGoal = (settled.statistics?.goals || []).reduce((earliest, goal) => Math.min(earliest, goal.minute), Infinity);
          const firstGoalLabel = Number.isFinite(firstGoal) ? `${firstGoal}'` : 'Sem timeline';
          return `<div class="result-row"><div class="fixture">${settled.homeTeam.name} × ${settled.awayTeam.name}<small>${competitionLabel(settled)}</small></div><div class="result-number">${prediction}% previsto</div><div class="result-number">${settled.score?.home ?? '—'}–${settled.score?.away ?? '—'}</div><div class="result-number">1º gol: ${firstGoalLabel}</div><div class="outcome ${hit ? 'win' : 'loss'}">${hit ? 'Acerto' : 'Falha'}</div></div>`;
        }).join('') : '<div class="empty">Nenhuma previsão disponível nesse corte.</div>';
        content.innerHTML = `
          <div class="lab-eyebrow">Análise pré-jogo × resultado real · somente ligas principais</div>
          <div class="lab-title-row"><h1 class="lab-title">Laboratório de<br>gols.</h1><p class="lab-source">${strategyData.length} jogos finalizados com previsão capturada antes do apito inicial. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div>
          <section class="lab-hero"><div class="hero-copy"><div class="hero-market">${GOALS_MARKETS[activeMarket].label} · corte ≥ ${activeThreshold}%</div><div class="hero-rate">${metrics.accuracy}</div><p class="hero-caption">${metrics.hits} acertos em ${metrics.selected.length} entradas selecionadas.</p></div><div class="hero-facts"><div class="hero-fact"><div class="hero-fact-value">${metrics.coverage}</div><div class="hero-fact-label">Cobertura</div></div><div class="hero-fact"><div class="hero-fact-value">${records.length}</div><div class="hero-fact-label">Amostra elegível</div></div><div class="hero-fact"><div class="hero-fact-value">${metrics.selected.length}</div><div class="hero-fact-label">Entradas</div></div><div class="hero-fact"><div class="hero-fact-value">${metrics.hits}</div><div class="hero-fact-label">Vitórias</div></div></div></section>
          <section class="market-strip">${marketButtons}</section>
          <div class="section-heading"><h2>Linha de confiança</h2><span>Escolha o corte operacional</span></div>
          <section class="threshold-rail">${thresholds}</section>
          <div class="section-heading"><h2>Jogos selecionados</h2><span>Ordenados pela previsão X7</span></div>
          <section class="lab-results"><div class="result-row header"><div>Partida</div><div>Previsão</div><div>Final</div><div>Ritmo</div><div>Resultado</div></div>${rows}</section>
          <p class="lab-note">A tela mede assertividade, não lucro. As odds de mercados de gols não estão registradas; “sem timeline” indica que o minuto do primeiro gol não pôde ser confirmado.</p>`;
        content.querySelectorAll('[data-market]').forEach(button => button.addEventListener('click', () => { activeMarket = button.dataset.market; renderGoalsLab(); }));
        content.querySelectorAll('[data-threshold]').forEach(button => button.addEventListener('click', () => { activeThreshold = Number(button.dataset.threshold); renderGoalsLab(); }));
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível montar o laboratório: ${error.message}</div>`;
      }
    }

    const formatKickoff = kickoffAt => new Date(kickoffAt).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
    const formatDate = kickoffAt => new Date(kickoffAt).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    const competitionLabel = match => match.competition
      ? (match.country ? `${match.country} · ${match.competition}` : match.competition)
      : 'Competição não informada';

    async function renderPredictions() {
      const content = document.getElementById('predictionsContent');
      content.innerHTML = '<div class="lab-loading">Consultando sinais no banco local…</div>';
      try {
        const config = PREDICTION_MARKETS[activePredictionMarket];
        const endpoint = predictionMode === 'upcoming'
          ? `${config.upcomingEndpoint}?minProbability=${predictionThreshold}`
          : config.historyEndpoint;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error('Banco local indisponível');
        const records = await response.json();
        const selected = predictionMode === 'upcoming'
          ? records
          : records.filter(record => record.probability >= predictionThreshold);
        const markets = Object.entries(PREDICTION_MARKETS).map(([key, market]) => `<button class="prediction-filter ${key === activePredictionMarket ? 'active' : ''}" data-prediction-market="${key}">${market.tabLabel}</button>`).join('');
        const filters = [70, 75, 80, 85, 90].map(threshold => `<button class="prediction-filter ${threshold === predictionThreshold ? 'active' : ''}" data-prediction-threshold="${threshold}">≥ ${threshold}%</button>`).join('');
        const modes = `<button class="prediction-filter ${predictionMode === 'upcoming' ? 'active' : ''}" data-prediction-mode="upcoming">Próximos jogos</button><button class="prediction-filter ${predictionMode === 'history' ? 'active' : ''}" data-prediction-mode="history">Histórico</button>`;

        if (predictionMode === 'history') {
          const hits = selected.filter(record => record.hit).length;
          const accuracy = selected.length ? Math.round((hits / selected.length) * 100) : 0;
          const dimensions = [{ key: 'hit', label: config.hitLabel }, ...(config.companions || [])];
          const hasCompanions = dimensions.length > 1;
          const dimensionStats = dimensions.map(dimension => {
            const known = selected.filter(record => record[dimension.key] !== undefined);
            const greens = known.filter(record => record[dimension.key]).length;
            return { label: dimension.label, greens, reds: known.length - greens, total: known.length };
          });
          const outcomeHeader = hasCompanions ? dimensions.map(d => d.label).join(' / ') : 'Resultado';
          const heroCaption = hasCompanions
            ? `${dimensionStats.map(d => `${d.label}: ${d.total ? Math.round((d.greens / d.total) * 100) : 0}% (${d.greens}/${d.total})`).join(' · ')} — ${selected.length} previsões selecionadas.`
            : `${hits} acertos em ${selected.length} previsões selecionadas.`;
          const heroFacts = hasCompanions
            ? dimensionStats.map(d => `<div class="hero-fact"><div class="hero-fact-value">${d.greens}</div><div class="hero-fact-label">Green ${d.label}</div></div>`).join('') + dimensionStats.map(d => `<div class="hero-fact"><div class="hero-fact-value">${d.reds}</div><div class="hero-fact-label">Red ${d.label}</div></div>`).join('')
            : `<div class="hero-fact"><div class="hero-fact-value">${records.length}</div><div class="hero-fact-label">Jogos analisados</div></div><div class="hero-fact"><div class="hero-fact-value">${hits}</div><div class="hero-fact-label">Green</div></div><div class="hero-fact"><div class="hero-fact-value">${selected.length - hits}</div><div class="hero-fact-label">Red</div></div><div class="hero-fact"><div class="hero-fact-value">${records.length ? Math.round((selected.length / records.length) * 100) : 0}%</div><div class="hero-fact-label">Cobertura</div></div>`;
          const outcomeBadge = (label, value) => {
            const state = value === undefined ? 'unknown' : value ? 'win' : 'loss';
            const text = value === undefined ? '—' : value ? 'Green' : 'Red';
            return `<span class="outcome ${state}">${label ? `${label} ${text}` : text}</span>`;
          };
          const rows = selected.sort((a, b) => b.probability - a.probability).map(record => {
            const outcomeCell = hasCompanions
              ? `<div class="outcome-pair">${dimensions.map(d => outcomeBadge(d.label, record[d.key])).join('')}</div>`
              : `<div class="outcome ${record.hit ? 'win' : 'loss'}">${record.hit ? 'Green' : 'Red'}</div>`;
            return `<div class="result-row"><div class="fixture">${record.homeTeam} × ${record.awayTeam}<small>${competitionLabel(record)}</small></div><div class="result-number">${record.probability}% previsto</div><div class="result-number">HT: ${record.halftimeGoals} · FT: ${record.finalGoals}</div><div class="result-number">1º gol: ${record.firstGoalMinute ? `${record.firstGoalMinute}'` : 'Sem timeline'}</div>${outcomeCell}</div>`;
          }).join('');
          content.innerHTML = `<div class="lab-eyebrow">Banco local · ${config.eyebrow} · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">${config.title}</h1><p class="lab-source">Histórico consolidado com a última previsão registrada antes do início da partida. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div><div class="prediction-controls">${markets}</div><div class="prediction-controls">${modes}</div><div class="prediction-controls">${filters}</div><section class="lab-hero"><div class="hero-copy"><div class="hero-market">Corte ≥ ${predictionThreshold}%</div><div class="hero-rate">${accuracy}%</div><p class="hero-caption">${heroCaption}</p></div><div class="hero-facts">${heroFacts}</div></section><div class="section-heading"><h2>Resultados históricos</h2><span>Ordenados pela previsão X7</span></div><section class="lab-results"><div class="result-row header"><div>Partida</div><div>Previsão</div><div>Placar</div><div>Ritmo</div><div>${outcomeHeader}</div></div>${rows || '<div class="empty">Nenhum jogo atende a este corte.</div>'}</section>`;
        } else {
          const groups = selected.reduce((grouped, prediction) => {
          const key = prediction.kickoffAt?.slice(0, 10) || 'sem-data';
          (grouped[key] ||= []).push(prediction);
          return grouped;
        }, {});
        const runway = Object.values(groups).map(group => `
          <section><div class="prediction-date">${formatDate(group[0].kickoffAt)}</div>
          ${group.map(prediction => {
            const strong = prediction.probability >= 90;
            return `<article class="prediction-card"><div class="prediction-time">${formatKickoff(prediction.kickoffAt)}</div><div class="prediction-fixture">${prediction.homeTeam} × ${prediction.awayTeam}<small>${competitionLabel(prediction)}</small></div><div><div class="prediction-probability">${prediction.probability}%</div><div class="prediction-detail">${config.badgeLabel}</div></div><div class="prediction-detail">Média gols: ${prediction.combinedGoalsAverage != null ? prediction.combinedGoalsAverage.toFixed(1) : '—'}<br>Over 0.5: ${prediction.over05Percentage ?? '—'}%</div><div class="prediction-signal ${strong ? '' : 'monitor'}">${strong ? 'Sinal forte' : 'Monitorar'}</div></article>`;
          }).join('')}</section>`).join('');
          content.innerHTML = `<div class="lab-eyebrow">Banco local · modelo X7 · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">Próximos jogos<br>${config.title}</h1><p class="lab-source">Sinais ordenados por horário. A odd exibida pelo modelo não é uma cotação real de aposta. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div><div class="prediction-controls">${markets}</div><div class="prediction-controls">${modes}</div><div class="prediction-controls">${filters}</div><div class="section-heading"><h2>${selected.length} oportunidades encontradas</h2><span>Corte atual: ${predictionThreshold}%</span></div><div class="prediction-runway">${runway || '<div class="empty">Nenhum próximo jogo atende a este corte.</div>'}</div><p class="lab-note">“Sinal forte” indica probabilidade do modelo ≥90%. Confirme escalações, mercado e cotação real antes de qualquer decisão.</p>`;
        }
        content.querySelectorAll('[data-prediction-market]').forEach(button => button.addEventListener('click', () => { activePredictionMarket = button.dataset.predictionMarket; renderPredictions(); }));
        content.querySelectorAll('[data-prediction-threshold]').forEach(button => button.addEventListener('click', () => { predictionThreshold = Number(button.dataset.predictionThreshold); renderPredictions(); }));
        content.querySelectorAll('[data-prediction-mode]').forEach(button => button.addEventListener('click', () => { predictionMode = button.dataset.predictionMode; renderPredictions(); }));
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar as previsões: ${error.message}</div>`;
      }
    }

    let patternMarket = 'over05Ft';
    let patternThreshold = 0;
    let patternMinAverage = 0;
    let patternMinScore = 0;
    let patternMinBttsPct = 0;
    let patternPreset = null;

    const PATTERN_MARKETS = {
      over05Ht: { label: 'O0.5 HT', key: 'over05HtProbability' },
      over05Ft: { label: 'O0.5 FT', key: 'over05FtProbability' },
      over15Ft: { label: 'O1.5 FT', key: 'over15FtProbability' },
      over25Ft: { label: 'O2.5 FT', key: 'over25FtProbability' },
      btts: { label: 'BTTS', key: 'bttsProbability' },
    };

    // Combos descobertos por busca exaustiva com validação temporal (644 jogos).
    const PATTERN_PRESETS = {
      combo89: { label: 'Combo 89%', apply: r => r.over25FtProbability >= 60 && r.bttsProbability >= 55 && r.bttsPercentage >= 55 },
      combo91: { label: 'Combo 91%', apply: r => r.over25FtProbability >= 60 && r.combinedGoalsAverage >= 3.4 && r.bttsPercentage >= 60 },
      score3: { label: 'Score ≥3', apply: r => r.signalScore >= 3 },
    };

    async function renderPattern() {
      const content = document.getElementById('patternContent');
      content.innerHTML = '<div class="lab-loading">Analisando jogos 0x0 aos 30 minutos no banco local…</div>';
      try {
        const response = await fetch('/api/history/zero-at-30');
        if (!response.ok) throw new Error('Banco local indisponível');
        const records = await response.json();
        const market = PATTERN_MARKETS[patternMarket];
        const preset = patternPreset ? PATTERN_PRESETS[patternPreset] : null;
        const selected = records
          .filter(record => patternThreshold === 0 || (record[market.key] != null && record[market.key] >= patternThreshold))
          .filter(record => patternMinAverage === 0 || (record.combinedGoalsAverage != null && record.combinedGoalsAverage >= patternMinAverage))
          .filter(record => patternMinScore === 0 || record.signalScore >= patternMinScore)
          .filter(record => patternMinBttsPct === 0 || (record.bttsPercentage != null && record.bttsPercentage >= patternMinBttsPct))
          .filter(record => !preset || preset.apply(record));
        const hits = selected.filter(record => record.hit).length;
        const accuracy = selected.length ? Math.round((hits / selected.length) * 100) : 0;
        const markets = Object.entries(PATTERN_MARKETS).map(([key, m]) => `<button class="prediction-filter ${key === patternMarket ? 'active' : ''}" data-pattern-market="${key}">${m.label}</button>`).join('');
        const filters = [0, 70, 75, 80, 85, 90].map(threshold => `<button class="prediction-filter ${threshold === patternThreshold ? 'active' : ''}" data-pattern-threshold="${threshold}">${threshold === 0 ? 'Todos' : `≥ ${threshold}%`}</button>`).join('');
        const averages = [0, 3.0, 3.3, 3.5].map(min => `<button class="prediction-filter ${min === patternMinAverage ? 'active' : ''}" data-pattern-average="${min}">${min === 0 ? 'Todas' : `≥ ${min.toFixed(1)}`}</button>`).join('');
        const scores = [0, 3, 4].map(min => `<button class="prediction-filter ${min === patternMinScore ? 'active' : ''}" data-pattern-score="${min}">${min === 0 ? 'Todos' : `≥ ${min} sinais`}</button>`).join('');
        const bttsPcts = [0, 55, 60, 70].map(min => `<button class="prediction-filter ${min === patternMinBttsPct ? 'active' : ''}" data-pattern-btts="${min}">${min === 0 ? 'Todos' : `≥ ${min}%`}</button>`).join('');
        const presets = Object.entries(PATTERN_PRESETS).map(([key, p]) => `<button class="prediction-filter ${key === patternPreset ? 'active' : ''}" data-pattern-preset="${key}">${p.label}</button>`).join('');
        const heroFact = (value, label) => `<div class="hero-fact"><div class="hero-fact-value">${value}</div><div class="hero-fact-label">${label}</div></div>`;
        const heroFacts = heroFact(selected.length, "Jogos 0x0 aos 30'")
          + heroFact(hits, "Green até 75'")
          + heroFact(selected.length - hits, 'Red (seguiu 0x0)')
          + heroFact(`${records.length ? Math.round((selected.length / records.length) * 100) : 0}%`, 'Cobertura');
        const cuts = [
          preset ? preset.label : null,
          patternThreshold === 0 ? null : `${market.label} ≥ ${patternThreshold}%`,
          patternMinAverage === 0 ? null : `média ≥ ${patternMinAverage.toFixed(1)}`,
          patternMinScore === 0 ? null : `score ≥ ${patternMinScore}`,
          patternMinBttsPct === 0 ? null : `BTTS%times ≥ ${patternMinBttsPct}`,
        ].filter(Boolean);
        const cutLabel = cuts.length ? cuts.join(' · ') : 'sem corte de sinal';
        const rows = selected.map(record => {
          const outcome = `<div class="outcome ${record.hit ? 'win' : 'loss'}">${record.hit ? 'Green' : 'Red'}</div>`;
          const firstGoal = record.firstGoalMinute != null ? `${record.firstGoalMinute}' · ${record.goalBand}` : 'Sem gol';
          const probability = record[market.key] != null ? `${market.label}: ${record[market.key]}%` : 'Sem previsão';
          const average = record.combinedGoalsAverage != null ? record.combinedGoalsAverage.toFixed(1) : '—';
          const bttsTeams = record.bttsPercentage != null ? `${record.bttsPercentage}%` : '—';
          const day = new Date(record.kickoffAt).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'America/Sao_Paulo' });
          return `<div class="result-row"><div class="fixture">${record.homeTeam} × ${record.awayTeam}<small>${competitionLabel(record)}</small></div><div class="result-number">${day}</div><div class="result-number">HT: ${record.halftimeGoals} · FT: ${record.finalGoals}<br>Média: ${average} · BTTS%: ${bttsTeams}</div><div class="result-number">1º gol: ${firstGoal}<br>${probability} · Score ${record.signalScore}/4</div>${outcome}</div>`;
        }).join('');
        content.innerHTML = `<div class="lab-eyebrow">Banco local · jogos 0x0 aos 30 minutos · somente ligas principais</div><div class="lab-title-row"><h1 class="lab-title">0x0 aos 30'.<br>Saiu gol até 75'?</h1><p class="lab-source">Somente jogos com timeline de gols (ou 0x0 final). Jogos com gol mas sem timeline ficam de fora, pois não dá para confirmar o placar aos 30'. Amador, juvenil, feminino e regional/reserva ficam de fora.</p></div><div class="prediction-controls"><span class="prediction-detail">Presets:</span>${presets}</div><div class="prediction-controls"><span class="prediction-detail">Sinal:</span>${markets}</div><div class="prediction-controls"><span class="prediction-detail">Corte:</span>${filters}</div><div class="prediction-controls"><span class="prediction-detail">Média de gols:</span>${averages}</div><div class="prediction-controls"><span class="prediction-detail">Score:</span>${scores}</div><div class="prediction-controls"><span class="prediction-detail">BTTS% dos times:</span>${bttsPcts}</div><section class="lab-hero"><div class="hero-copy"><div class="hero-market">Gol entre 31' e 75' · ${cutLabel}</div><div class="hero-rate">${accuracy}%</div><p class="hero-caption">${hits} de ${selected.length} jogos que estavam 0x0 aos 30' tiveram gol até os 75'.</p></div><div class="hero-facts">${heroFacts}</div></section><div class="section-heading"><h2>Resultados</h2><span>Mais recentes primeiro</span></div><section class="lab-results"><div class="result-row header"><div>Partida</div><div>Data</div><div>Placar</div><div>1º gol</div><div>Resultado</div></div>${rows || '<div class="empty">Nenhum jogo atende a este corte.</div>'}</section>`;
        content.querySelectorAll('[data-pattern-market]').forEach(button => button.addEventListener('click', () => { patternMarket = button.dataset.patternMarket; patternPreset = null; renderPattern(); }));
        content.querySelectorAll('[data-pattern-threshold]').forEach(button => button.addEventListener('click', () => { patternThreshold = Number(button.dataset.patternThreshold); patternPreset = null; renderPattern(); }));
        content.querySelectorAll('[data-pattern-average]').forEach(button => button.addEventListener('click', () => { patternMinAverage = Number(button.dataset.patternAverage); patternPreset = null; renderPattern(); }));
        content.querySelectorAll('[data-pattern-score]').forEach(button => button.addEventListener('click', () => { patternMinScore = Number(button.dataset.patternScore); patternPreset = null; renderPattern(); }));
        content.querySelectorAll('[data-pattern-btts]').forEach(button => button.addEventListener('click', () => { patternMinBttsPct = Number(button.dataset.patternBtts); patternPreset = null; renderPattern(); }));
        content.querySelectorAll('[data-pattern-preset]').forEach(button => button.addEventListener('click', () => { const key = button.dataset.patternPreset; patternPreset = patternPreset === key ? null : key; patternThreshold = 0; patternMinAverage = 0; patternMinScore = 0; patternMinBttsPct = 0; renderPattern(); }));
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar o padrão: ${error.message}</div>`;
      }
    }

    // Update stats bar
    function updateStats() {
      const matches = getFilteredMatches();
      const totalGoals = matches.reduce((sum, m) => {
        const goals = m.statistics?.goals || [];
        return sum + goals.length;
      }, 0);
      const leagues = new Set(matches.map(m => m.competition)).size;

      document.getElementById('totalMatches').textContent = matches.length;
      document.getElementById('totalGoals').textContent = totalGoals;
      document.getElementById('avgGoals').textContent = matches.length > 0 
        ? (totalGoals / matches.length).toFixed(1) 
        : '0';
      document.getElementById('totalLeagues').textContent = leagues;
    }

    // Get filtered matches
    function getFilteredMatches() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      return allMatches.filter(m => {
        if (search && !m.homeTeam.name.toLowerCase().includes(search) 
            && !m.awayTeam.name.toLowerCase().includes(search)) {
          return false;
        }
        if (status && m.status !== status) {
          return false;
        }
        return true;
      });
    }

    // Render matches
    function renderMatches() {
      const matches = getFilteredMatches();
      const grid = document.getElementById('matchGrid');

      if (matches.length === 0) {
        grid.innerHTML = '<div class="empty">Nenhum jogo encontrado</div>';
        return;
      }

      // Group by competition
      const grouped = {};
      matches.forEach(m => {
        const key = m.competition || 'Desconhecido';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(m);
      });

      let html = '';
      for (const [comp, compMatches] of Object.entries(grouped)) {
        html += `<div style="margin-bottom: 24px;">`;
        html += `<h3 style="font-size: 14px; color: #8b8f98; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #2d3139;">${comp} (${compMatches.length})</h3>`;
        html += `<div class="match-grid">`;
        
        compMatches.forEach(m => {
          const hasGoals = m.statistics?.goals?.length > 0;
          const statusClass = `status-${m.status || 'not_started'}`;
          const statusText = {
            'not_started': 'Aguardando',
            'live': 'Ao Vivo',
            'finished': 'Finalizado',
            'cancelled': 'Cancelado'
          }[m.status] || m.status;

          const kickoffBrasilia = m.kickoffBrasilia 
            ? new Date(m.kickoffBrasilia).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
            : '';

          const scoreHome = m.score?.home ?? '-';
          const scoreAway = m.score?.away ?? '-';

          html += `
            <div class="match-card ${hasGoals ? 'has-goals' : ''}" onclick='showDetail(${JSON.stringify(m).replace(/'/g, "&#39;")})'>
              <div class="match-header">
                <span class="competition">${m.country || ''} ${kickoffBrasilia ? '• ' + kickoffBrasilia : ''}</span>
                <span class="status ${statusClass}">${statusText}</span>
              </div>
              <div class="teams">
                <div class="team">
                  <div class="team-name">${m.homeTeam.name}</div>
                </div>
                <div class="score">
                  ${scoreHome}<span class="separator">:</span>${scoreAway}
                </div>
                <div class="team">
                  <div class="team-name">${m.awayTeam.name}</div>
                </div>
              </div>
              ${hasGoals ? renderGoals(m.statistics.goals) : ''}
            </div>
          `;
        });
        
        html += `</div></div>`;
      }

      grid.innerHTML = html;
    }

    // Render goals
    function renderGoals(goals) {
      if (!goals || goals.length === 0) return '';
      
      let html = '<div class="goals-list">';
      goals.forEach(g => {
        const minute = g.extraMinute ? `${g.minute}+${g.extraMinute}` : g.minute;
        const team = g.team === 'home' ? '🏠' : '✈️';
        html += `
          <div class="goal">
            <span class="goal-minute">${minute}'</span>
            <span>${team}</span>
            <span class="goal-player">${g.player || 'Gol'}</span>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    // Show match detail
    function showDetail(match) {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');

      title.textContent = `${match.homeTeam.name} vs ${match.awayTeam.name}`;

      let html = '';

      // Score
      html += `
        <div class="teams" style="margin-bottom: 20px;">
          <div class="team"><div class="team-name">${match.homeTeam.name}</div></div>
          <div class="score">${match.score?.home ?? '-'}<span class="separator">:</span>${match.score?.away ?? '-'}</div>
          <div class="team"><div class="team-name">${match.awayTeam.name}</div></div>
        </div>
      `;

      // Odds
      if (match.odds) {
        html += `
          <div class="odds-row">
            <div class="odd-item">
              <div class="odd-label">Casa</div>
              <div class="odd-value">${match.odds.home || '-'}</div>
            </div>
            <div class="odd-item">
              <div class="odd-label">Empate</div>
              <div class="odd-value">${match.odds.draw || '-'}</div>
            </div>
            <div class="odd-item">
              <div class="odd-label">Fora</div>
              <div class="odd-value">${match.odds.away || '-'}</div>
            </div>
          </div>
        `;
      }

      // Statistics
      if (match.statistics) {
        const s = match.statistics;
        html += `<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px; color: #8b8f98;">Estatísticas</h3>`;
        html += `<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">`;
        
        const stats = [
          ['Média Gols Casa', s.homeGoalsAverage],
          ['Média Gols Fora', s.awayGoalsAverage],
          ['Over 0.5', s.over05Percentage ? `${s.over05Percentage}%` : null],
          ['Over 1.5', s.over15Percentage ? `${s.over15Percentage}%` : null],
          ['Over 2.5', s.over25Percentage ? `${s.over25Percentage}%` : null],
          ['BTTS', s.bttsPercentage ? `${s.bttsPercentage}%` : null],
        ];

        stats.forEach(([label, value]) => {
          if (value !== null && value !== undefined) {
            html += `
              <div style="background: #252830; padding: 8px 12px; border-radius: 6px;">
                <div style="font-size: 11px; color: #8b8f98;">${label}</div>
                <div style="font-size: 16px; font-weight: 600; color: #ffd21e;">${value}</div>
              </div>
            `;
          }
        });
        html += `</div>`;
      }

      // Goals
      if (match.statistics?.goals?.length > 0) {
        html += `<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px; color: #8b8f98;">Gols</h3>`;
        match.statistics.goals.forEach(g => {
          const minute = g.extraMinute ? `${g.minute}+${g.extraMinute}` : g.minute;
          const team = g.team === 'home' ? match.homeTeam.name : match.awayTeam.name;
          html += `
            <div class="goal">
              <span class="goal-minute">${minute}'</span>
              <span class="goal-player">${g.player || 'Gol'}</span>
              <span class="goal-team">(${team})</span>
            </div>
          `;
        });
      }

      // Timeline
      if (match.statistics?.timeline?.length > 0) {
        html += `<h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 14px; color: #8b8f98;">Timeline</h3>`;
        const icons = { goal: '⚽', yellow_card: '🟨', substitution: '🔄', offside: '🚩' };
        
        match.statistics.timeline.forEach(t => {
          const minute = t.extraMinute ? `${t.minute}+${t.extraMinute}` : t.minute;
          const icon = icons[t.type] || '📋';
          const team = t.team === 'home' ? match.homeTeam.name : match.awayTeam.name;
          
          html += `
            <div class="timeline-item">
              <span class="timeline-icon">${icon}</span>
              <span class="timeline-minute">${minute}'</span>
              <div class="timeline-content">
                <div class="timeline-player">${t.player || t.description || t.type}</div>
                <div class="timeline-desc">${team}</div>
              </div>
            </div>
          `;
        });
      }

      // Source
      html += `
        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid #2d3139;">
          <a href="${match.sourceUrl}" target="_blank" style="color: #ffd21e; font-size: 12px; text-decoration: none;">
            Ver no SokkerPRO →
          </a>
        </div>
      `;

      content.innerHTML = html;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Event listeners
    document.getElementById('fileSelect').addEventListener('change', (e) => {
      if (e.target.value) loadData(e.target.value);
    });

    document.getElementById('searchInput').addEventListener('input', () => {
      updateStats();
      renderMatches();
    });

    document.getElementById('statusFilter').addEventListener('change', () => {
      updateStats();
      renderMatches();
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.querySelectorAll('.view-tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.view-tab, .app-view').forEach(element => element.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.view).classList.add('active');
      document.body.classList.toggle('lab-active', tab.dataset.view === 'labView');
      document.body.classList.toggle('prediction-active', tab.dataset.view === 'predictionsView');
      document.body.classList.toggle('today-active', tab.dataset.view === 'todayView');
      document.body.classList.toggle('favorites-active', tab.dataset.view === 'favoritesView');
      document.body.classList.toggle('pattern-active', tab.dataset.view === 'patternView');
      if (tab.dataset.view === 'labView') renderGoalsLab();
      if (tab.dataset.view === 'predictionsView') renderPredictions();
      if (tab.dataset.view === 'patternView') renderPattern();
      if (tab.dataset.view === 'todayView') renderToday();
      if (tab.dataset.view === 'favoritesView') renderFavorites();
    }));

    // Init
    loadFiles();
  </script>
</body>
</html>
