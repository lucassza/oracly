          // combinações reais entre si e decidir qual corte vale a pena apertar.
          const agreementBreakdown = HT_AGREEMENT_FILTERS.filter(key => key !== 'all').map(key => {
            const bucket = confidenceAndFavoritesFiltered.filter(record => htAgreementKey(record) === key);
            return { key, n: bucket.length, rate: bucket.length ? rate(bucket) : null };
          });
          const agreementBreakdownHtml = `
            <section class="best-filter-banner">
              <div class="best-filter-title">Acerto por fontes (com os filtros de confiança/favoritas atuais)</div>
              <div class="best-filter-list">${agreementBreakdown.map(b => `
                <div class="best-filter-item ${b.key === htAgreementFilter ? 'top' : ''}">
                  <span class="best-filter-market">${b.key} fontes</span>
                  <span class="best-filter-rate">${b.rate === null ? '—' : `${b.rate}%`}</span>
                  <span class="best-filter-n">${b.n} jogos</span>
                </div>`).join('')}</div>
            </section>`;

          const heroFacts = `
            <div class="hero-fact"><div class="hero-fact-value">${selected.length}</div><div class="hero-fact-label">Jogos analisados</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${hits}</div><div class="hero-fact-label">Green</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${selected.length - hits}</div><div class="hero-fact-label">Red</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${favoriteRecords.length ? `${rate(favoriteRecords)}%` : '—'}</div><div class="hero-fact-label">Ligas favoritas (n=${favoriteRecords.length})</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${otherRecords.length ? `${rate(otherRecords)}%` : '—'}</div><div class="hero-fact-label">Outras ligas (n=${otherRecords.length})</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${clean.length ? `${rate(clean)}%` : '—'}</div><div class="hero-fact-label">Trilha limpa (n=${clean.length})</div></div>
            <div class="hero-fact"><div class="hero-fact-value">${dirty.length ? `${rate(dirty)}%` : '—'}</div><div class="hero-fact-label">Trilha backfill (n=${dirty.length})</div></div>`;

          const header = `<div class="ht-result-row header"><div>Data/Horário</div><div>Partida</div><div>Casa / Empate / Fora</div><div>Exclui</div><div>Fontes</div><div>Placar HT</div><div>Placar Final</div><div>Resultado</div></div>`;
          const rows = [...selected].sort((a, b) => (b.kickoffAt ?? '').localeCompare(a.kickoffAt ?? '')).map(record => `
            <div class="ht-result-row">
              <div class="result-number">${formatKickoffShort(record.kickoffAt)}</div>
              <div class="fixture">${htFavToggle(record)}${record.homeTeam} × ${record.awayTeam}<small>${competitionLabel(record)}</small></div>
              ${htProbsCell(record)}
              <div>${htExcludeBadge(record)}</div>
              <div>${htAgreementBadge(record)}</div>
              <div class="result-number">${record.halftimeHome}–${record.halftimeAway}</div>
              <div class="result-number">${record.homeScore ?? '—'}–${record.awayScore ?? '—'}</div>
              <div class="outcome ${record.hit ? 'win' : 'loss'}">${record.hit ? 'Green' : 'Red'}</div>
            </div>`).join('');

          content.innerHTML = `${intro}
            <div class="prediction-controls">${modes}</div>
            <div class="prediction-controls">${confidenceFilters}${favoritesToggle}</div>
            <div class="prediction-controls">${agreementFilters}</div>
            ${bestConfidenceNote}
            ${agreementBreakdownHtml}
            <section class="lab-hero"><div class="hero-copy"><div class="hero-market">${htMinConfidence ? `Confiança ≥ ${htMinConfidence}%` : 'Cobertura total'}</div><div class="hero-rate">${accuracy}%</div><p class="hero-caption">${hits} acertos em ${selected.length} jogos com placar HT conhecido.</p></div><div class="hero-facts">${heroFacts}</div></section>
            <div class="section-heading"><h2>Resultados históricos</h2><span>Mais recentes primeiro</span></div>
            <section class="lab-results">${header}${rows || '<div class="empty">Nenhum jogo com placar HT nesse corte.</div>'}</section>
            <p class="lab-note">"Trilha backfill" usa médias de 1º tempo buscadas bem depois do jogo (comando backfill-ht) — pode não refletir a forma do time como era antes da partida. "Trilha limpa" vem do scrape normal, coletado antes do kickoff. Placar HT via scoresLocalTeamHT/scoresVisitorTeamHT da SokkerPRO.</p>`;
        } else {
          const groups = selected.reduce((grouped, record) => {
            const key = record.kickoffAt?.slice(0, 10) || 'sem-data';
            (grouped[key] ||= []).push(record);
            return grouped;
          }, {});
          const runway = Object.values(groups).map(group => `
            <section><div class="prediction-date">${formatDate(group[0].kickoffAt)}</div>
            ${group.map(record => `<article class="ht-card">
              <div class="prediction-time">${formatKickoff(record.kickoffAt)}</div>
              <div class="prediction-fixture">${htFavToggle(record)}${record.homeTeam} × ${record.awayTeam}<small>${competitionLabel(record)}</small></div>
              ${htProbsCell(record)}
              ${htExcludeBadge(record)}
              ${htAgreementBadge(record)}
            </article>`).join('')}</section>`).join('');

          content.innerHTML = `${intro}
            <div class="prediction-controls">${modes}</div>
            <div class="prediction-controls">${confidenceFilters}${favoritesToggle}</div>
            <div class="prediction-controls">${agreementFilters}</div>
            ${bestConfidenceNote}
            <div class="section-heading"><h2>${selected.length} jogos com sinal</h2><span>Corte atual: ${htMinConfidence ? `confiança ≥ ${htMinConfidence}%` : 'todos'}</span></div>
            <div class="prediction-runway">${runway || '<div class="empty">Nenhum próximo jogo com médias de 1º tempo suficientes.</div>'}</div>
            <p class="lab-note">Horário em Brasília. "Fontes" mostra quantas fontes (Poisson + odds 1T + odds FT, quando disponíveis) concordam com a exclusão. Amador, juvenil, feminino e regional/reserva ficam de fora.</p>`;
        }

        content.querySelectorAll('[data-ht-mode]').forEach(button => button.addEventListener('click', () => { htMode = button.dataset.htMode; renderHtExclusion(); }));
        content.querySelectorAll('[data-ht-confidence]').forEach(button => button.addEventListener('click', () => { htMinConfidence = Number(button.dataset.htConfidence); htConfidenceLocked = true; renderHtExclusion(); }));
        content.querySelectorAll('[data-ht-agreement]').forEach(button => button.addEventListener('click', () => { htAgreementFilter = button.dataset.htAgreement; htBestConfidenceCache = null; renderHtExclusion(); }));
        content.querySelectorAll('[data-ht-toggle-fav]').forEach(button => button.addEventListener('click', () => {
          const key = button.dataset.htToggleFav;
          if (!key) return;
          favorites.leagues = favorites.leagues.includes(key) ? favorites.leagues.filter(l => l !== key) : [...favorites.leagues, key];
          saveFavorites();
          htBestConfidenceCache = null;
          renderHtExclusion();
        }));
        const htFavoritesToggleButton = document.getElementById('htFavoritesToggle');
        if (htFavoritesToggleButton) htFavoritesToggleButton.addEventListener('click', () => { htFavoritesOnly = !htFavoritesOnly; htBestConfidenceCache = null; renderHtExclusion(); });
      } catch (error) {
        content.innerHTML = `<div class="empty">Não foi possível carregar o modelo de 1º tempo: ${error.message}</div>`;
      }
    }

    document.querySelectorAll('.view-tab').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('.view-tab, .app-view').forEach(element => element.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.view).classList.add('active');
      document.body.classList.toggle('prediction-active', tab.dataset.view === 'predictionsView');
      document.body.classList.toggle('today-active', tab.dataset.view === 'todayView');
      document.body.classList.toggle('favorites-active', tab.dataset.view === 'favoritesView');
      if (tab.dataset.view === 'predictionsView') renderPredictions();
      if (tab.dataset.view === 'todayView') renderToday();
      if (tab.dataset.view === 'dailyView') renderDaily();
      if (tab.dataset.view === 'htExclusionView') renderHtExclusion();
      if (tab.dataset.view === 'favoritesView') renderFavorites();
    }));

    // Init — espera os favoritos (banco compartilhado) antes do primeiro render, senão a
    // Lista diária abriria já filtrando com favoritos vazios por uma fração de segundo.
    (async () => {
      await favoritesReady;
      renderDaily();
    })();
  </script>
</body>
</html>
