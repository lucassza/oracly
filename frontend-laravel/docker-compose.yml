services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oracly-frontend-laravel:local
    container_name: oracly-frontend-laravel
    ports:
      # Expõe na LAN (ex.: http://192.168.15.18:8000/admin/login)
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "${APP_URL:-http://192.168.15.18:8000}"
      DB_CONNECTION: sqlite
      # Se o Postgres Oracly estiver no host da máquina, use host.docker.internal
      # (já habilitado via extra_hosts abaixo). Para IP remoto, use o IP em ORACLY_DB_HOST.
    volumes:
      - ./:/var/www/html
      - frontend_laravel_vendor:/var/www/html/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  frontend_laravel_vendor:
